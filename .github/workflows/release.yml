name: Release

# Run by hand: Actions → Release → Run workflow, with the new version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, like 2.0.0"
        required: true
      changelog:
        description: "Changelog in Markdown; leave empty to take the version's section from CHANGELOG.md"
        required: false
      modrinth:
        description: "Also publish to Modrinth (needs the MODRINTH_TOKEN secret)"
        type: boolean
        default: false
      hangar:
        description: "Also publish to Hangar (needs the HANGAR_TOKEN secret)"
        type: boolean
        default: false
      curseforge:
        description: "Also publish to CurseForge (needs the CURSEFORGE_TOKEN secret)"
        type: boolean
        default: false
      moonlands:
        description: "Ship the release to Moonlands (needs the FAMILY_ACTIONS_TOKEN secret)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      CHANGELOG: ${{ inputs.changelog }}
      # Outside the repo files, but in the workspace, where Gradle finds it by a relative path.
      NOTES: release-notes.md
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::$VERSION isn't a version like 2.0.0"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION is already released"; exit 1
          fi
      - name: Write the release notes
        shell: python
        run: |
          import os, re, sys
          version, typed = os.environ["VERSION"], os.environ["CHANGELOG"].strip()
          if typed:
              notes = typed
          else:
              text = open("CHANGELOG.md", encoding="utf-8").read()
              match = re.search(rf"^## {re.escape(version)}\s*$(.*?)(?=^## |\Z)", text, re.M | re.S)
              notes = match.group(1).strip() if match else ""
          if not notes:
              sys.exit(f"::error::No changelog: add a “## {version}” section to CHANGELOG.md or fill the changelog field")
          open(os.environ["NOTES"], "w", encoding="utf-8").write(notes + "\n")
          print(notes)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Read the platforms
        # `mobosses.mods` in gradle.properties: off while the mods are only frames, so the release ships Paper alone.
        # Empty mods must never reach a store.
        run: echo "MODS=$(sed -n 's/^mobosses\.mods=//p' gradle.properties)" >> "$GITHUB_ENV"
      - name: Build and test
        run: ./gradlew build -PreleaseVersion="$VERSION"
      - name: Publish the GitHub release
        # Every jar twice more without the version, so releases/latest/download/mobosses-paper.jar (and, with the mods,
        # mobosses-fabric.jar and mobosses-neoforge.jar) always fetches the newest; mobosses.jar, the Paper jar's name up
        # to 2.9.0, keeps older links working.
        run: |
          cp "paper/build/libs/mobosses-paper-$VERSION.jar" paper/build/libs/mobosses-paper.jar
          cp "paper/build/libs/mobosses-paper-$VERSION.jar" paper/build/libs/mobosses.jar
          jars=("paper/build/libs/mobosses-paper-$VERSION.jar" paper/build/libs/mobosses-paper.jar paper/build/libs/mobosses.jar)
          if [[ "$MODS" == "true" ]]; then
            for loader in fabric neoforge; do
              cp "$loader/build/libs/mobosses-$loader-$VERSION.jar" "$loader/build/libs/mobosses-$loader.jar"
              jars+=("$loader/build/libs/mobosses-$loader-$VERSION.jar" "$loader/build/libs/mobosses-$loader.jar")
            done
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Mo’Bosses $VERSION" --notes-file "$NOTES" "${jars[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to Modrinth
        if: inputs.modrinth
        # Minotaur reads the project while it runs, which the configuration cache doesn't allow. With the mods on, it
        # uploads X.Y.Z+paper; the mods go through Modrinth's v3 API as X.Y.Z+fabric and X.Y.Z+neoforge, since Minotaur
        # can't set the environment Modrinth asks of a mod.
        run: |
          ./gradlew :paper:modrinth -PreleaseVersion="$VERSION" -PchangelogFile="$NOTES" --no-configuration-cache
          if [[ "$MODS" == "true" ]]; then python3 -I scripts/modrinth_mods.py --version "$VERSION" --notes "$NOTES"; fi
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      - name: Publish to Hangar
        if: inputs.hangar
        run: ./gradlew :paper:publishPluginPublicationToHangar -PreleaseVersion="$VERSION" -PchangelogFile="$NOTES" --no-configuration-cache
        env:
          HANGAR_TOKEN: ${{ secrets.HANGAR_TOKEN }}

      - name: Publish to CurseForge
        if: inputs.curseforge
        # A CurseForge project holds one class, so Paper's jar goes to the plugin project (on dev.bukkit.org) and the
        # mods to the mod project; the game version comes from the build, as Modrinth's does.
        run: |
          game=$(sed -nE 's/.*gameVersions\.addAll\("([^"]+)".*/\1/p' paper/build.gradle.kts)
          python3 -I scripts/curseforge.py "paper/build/libs/mobosses-paper-$VERSION.jar" --project 1766137 --kind plugin --game "$game" --name "Mo’Bosses $VERSION" --notes "$NOTES"
          if [[ "$MODS" == "true" ]]; then
            mods_game=$(sed -nE 's/^val minecraft = "([^"]+)"/\1/p' fabric/build.gradle.kts)
            python3 -I scripts/curseforge.py "fabric/build/libs/mobosses-fabric-$VERSION.jar" --project 1766190 --kind mod --loader fabric --requires fabric-api --game "$mods_game" --name "Mo’Bosses $VERSION for Fabric" --notes "$NOTES"
            python3 -I scripts/curseforge.py "neoforge/build/libs/mobosses-neoforge-$VERSION.jar" --project 1766190 --kind mod --loader neoforge --game "$mods_game" --name "Mo’Bosses $VERSION for NeoForge" --notes "$NOTES"
          fi
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

  deploy:
    needs: release
    if: inputs.moonlands
    runs-on: ubuntu-latest
    steps:
      - name: Ship to Moonlands
        # Moonlands' “Ship a release” workflow puts the new jar on the server, unless it's built for another game version.
        run: gh workflow run ship-plugin.yml -R MairwunNx/minecraft -f repo="$GITHUB_REPOSITORY" -f version="$VERSION"
        env:
          GH_TOKEN: ${{ secrets.FAMILY_ACTIONS_TOKEN }}
          VERSION: ${{ inputs.version }}
