###############################################################################
#                          Mo’Bosses loot                                     #
###############################################################################
# Each player who deals enough of a boss's health (loot.min_damage_share in
# config.yml) gets one item, picked by weight among the entries whose level
# range holds the boss's level and whose mobclass is the boss's class or below.
# Each class below the boss's divides the odds: ×0.6, ×0.3, ×0.15, ×0.08, ×0.03.
#
#   material           an item id, like DIAMOND_SWORD or minecraft:diamond_sword
#   mobclass           the lowest boss class that drops it
#   min_level/max_level  the boss levels it drops at
#   amount             a number or a range like "2-6"; each level above
#                      min_level adds per_level_drop_factor of it
#   weight             its odds against the other entries
#   random_durability  comes partly worn (loot.random_durability in config.yml)
#   enchantments       id: level or a range, like { sharpness: "1-2" }
#   itemClass          rare, epic, legendary, or mythic: announced to everyone
#   id                 its name and lore in lang/ under items.<id>, so each
#                      player reads them in their own language
#   title, lore        a fixed name and lore for everyone instead, in MiniMessage
#                      or with & color codes, as 1.x had them

