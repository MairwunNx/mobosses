###############################################################################
#                          Mo’Bosses classes                                  #
###############################################################################
# Six classes from Common to Mythic. A new boss picks one by `chance`, a weight.
# Each class multiplies the boss's health, damage, experience, armor (defense),
# and toughness; formula in config.yml shrinks the difference at high levels.
# color: a color name (WHITE, YELLOW, AQUA, DARK_PURPLE, GOLD, RED, …) or #RRGGBB,
# for the name, the glow, and the boss bar. ability_thresholds: the boss level
# each ability starts at. Class names live in lang/ under classes.<class>.
# Loot follows this order: a boss drops loot of its class and the ones below.


