# Nombres y descripciones del botín, por el id de loottable.yml.
items:
  apprentice_stone_blade:
    name: "<blue>Espada de piedra del aprendiz"
    lore:
      - "<gray>Sencilla, pero mantiene el filo."
      - "<dark_gray>El primer paso de un cazador de jefes."
  recruit_chainmail_helmet:
    name: "<blue>Casco de malla del recluta"
    lore:
      - "<gray>Protege tu cabeza de errores tontos."
      - "<dark_gray>No es el mejor, pero es mejor que nada."
  tracker_leather_vest:
    name: "<blue>Chaleco de cuero del rastreador"
    lore:
      - "<gray>Armadura ligera, movimiento libre."
      - "<dark_gray>Hecho para explorar y cazar."
  seeker_leather_leggings:
    name: "<blue>Grebas de cuero del buscador"
    lore:
      - "<gray>Algo de abrigo para los caminos largos."
      - "<dark_gray>Resisten el barro y la lluvia."
  tracker_fishing_rod:
    name: "<blue>Caña de pescar del rastreador"
    lore:
      - "<gray>Comida y botín llegan al paciente."
      - "<dark_gray>A veces pesca algo más que peces."
  veteran_iron_blade:
    name: "<dark_purple>Espada de hierro del veterano"
    lore:
      - "<gray>Filo y peso en equilibrio."
      - "<dark_gray>Firme en cualquier combate."
  guardian_iron_helmet:
    name: "<dark_purple>Casco de hierro del guardián"
    lore:
      - "<gray>Buena cubierta para frente y sienes."
      - "<dark_gray>Obra de herrero sin atajos."
  marksman_bow:
    name: "<dark_purple>Arco del tirador"
    lore:
      - "<gray>La distancia es tu aliada."
      - "<dark_gray>La flecha encuentra el punto débil."
  chainmail_boots:
    name: "<dark_purple>Botas de malla"
    lore:
      - "<gray>Más silenciosas de lo que parecen."
      - "<dark_gray>Pisa con más valor."
  golden_apple:
    name: "<dark_purple>Manzana dorada"
    lore:
      - "<gray>El dulce sabor de una segunda oportunidad."
  book_of_forgotten_crafts:
    name: "<gold>Libro de oficios olvidados"
    lore:
      - "<yellow>Sus páginas huelen a forja y batalla."
      - "<gray>Cada palabra corta."
  hero_chestplate:
    name: "<gold>Peto del héroe"
    lore:
      - "<yellow>Una protección probada por la gloria."
      - "<gray>Solo la llevan los dignos."
  master_pickaxe:
    name: "<gold>Pico del maestro"
    lore:
      - "<yellow>Saltan chispas, el mineral cede."
      - "<gray>El acero canta en manos expertas."
  champion_chainmail:
    name: "<gold>Cota de malla del campeón"
    lore:
      - "<yellow>Suena como una fanfarria de victoria."
      - "<gray>Cada eslabón, una lección de batalla."
  forerunner_diamond_helmet:
    name: "<light_purple>Casco de diamante del precursor"
    lore:
      - "<dark_purple>Frío como la piedra, sereno en batalla."
      - "<gray>Te quita el miedo al golpe."
  tome_of_primal_warding:
    name: "<light_purple>Tomo de la protección primigenia"
    lore:
      - "<dark_purple>Hechizos más densos que el acero."
      - "<gray>Un amuleto para los valientes."
  sentinel_helmet:
    name: "<blue>Casco del centinela"
    lore:
      - "<gray>Mira a la tormenta a la cara."
      - "<dark_gray>No se raja al primer golpe."
  carpenter_stone_axe:
    name: "<blue>Hacha de piedra del carpintero"
    lore:
      - "<gray>Pesada, pero fiable."
      - "<dark_gray>La madera es su elemento."
  tracker_iron_boots:
    name: "<blue>Botas de hierro del rastreador"
    lore:
      - "<gray>Deja huellas, conserva tus pies."
      - "<dark_gray>Probadas en barro y piedra."
  hunter_fishing_rod:
    name: "<blue>Caña de pescar del cazador"
    lore:
      - "<gray>Botín para el paciente."
      - "<dark_gray>A veces pica la suerte."
  sentinel_chainmail:
    name: "<blue>Cota de malla del centinela"
    lore:
      - "<gray>Tintinean los anillos, huyen los enemigos."
      - "<dark_gray>Mejor que espinas, más ligera que placas."
  veteran_cuirass:
    name: "<dark_purple>Coraza del veterano"
    lore:
      - "<gray>Aguanta el golpe y la línea."
      - "<dark_gray>Dura más que cualquier juramento."
  tract_of_protection_1:
    name: "<dark_purple>Tratado de Protección I"
    lore:
      - "<gray>Breve y al grano."
      - "<dark_gray>La armadura amará estas líneas."
  steel_blade:
    name: "<dark_purple>Espada de acero"
    lore:
      - "<gray>Equilibrada y predecible."
      - "<dark_gray>Sin sorpresas en batalla, salvo la victoria."
  keeper_leggings:
    name: "<dark_purple>Grebas del custodio"
    lore:
      - "<gray>Donde otros caen, tú resistes."
      - "<dark_gray>El peso es el precio de la firmeza."
  steppe_wind_bow:
    name: "<dark_purple>Arco del viento de la estepa"
    lore:
      - "<gray>La flecha marca el camino."
      - "<dark_gray>Tensa más suave, vuela más lejos."
  golden_apple_salvation:
    name: "<dark_purple>Manzana dorada"
    lore:
      - "<gray>La dulzura de la salvación."
  tract_of_sharpness_1_2:
    name: "<dark_purple>Tratado de Filo I–II"
    lore:
      - "<gray>El filo se vuelve más honesto."
      - "<dark_gray>Y los enemigos, más cortos."
  blade_of_field_strife:
    name: "<gold>Espada de la contienda"
    lore:
      - "<gray>Ha visto más batallas que hogueras."
      - "<dark_gray>Afilada y justa."
  sentinel_diamond_crown:
    name: "<gold>Corona de diamante del centinela"
    lore:
      - "<gray>Pesada y, por eso, fiable."
      - "<dark_gray>Repele dudas y flechas."
  underground_king_pickaxe:
    name: "<gold>Pico del rey subterráneo"
    lore:
      - "<gray>El mineral cede sin juicio."
      - "<dark_gray>El acero guía, las manos lo siguen."
  codex_of_unbreaking_1:
    name: "<gold>Códice de Irrompibilidad I"
    lore:
      - "<gray>El equipo vive más."
      - "<dark_gray>Una grieta no es una condena."
  blade_of_the_twilight_edge:
    name: "<light_purple>Espada del filo crepuscular"
    lore:
      - "<dark_purple>Donde la luz y la sombra discuten,"
      - "<gray>esta espada decide."
  eternal_marshal_carapace:
    name: "<light_purple>Coraza del mariscal eterno"
    lore:
      - "<dark_purple>Un paso más firme que la piedra."
      - "<gray>Las flechas recuerdan cómo volar."
  journeyman_iron_blade:
    name: "<blue>Espada de hierro del oficial"
    lore:
      - "<gray>Equilibrada y testaruda."
      - "<dark_gray>Sobrevive a cualquier pelea."
  miners_guild_pickaxe:
    name: "<blue>Pico del gremio minero"
    lore:
      - "<gray>Más hondo es más cerca."
      - "<dark_gray>Chispas como estrellas del abismo."
  watchman_bow:
    name: "<blue>Arco del vigía"
    lore:
      - "<gray>Más quieto que el viento, más fiel."
      - "<dark_gray>Sus flechas no olvidan el blanco."
  guard_chestplate:
    name: "<blue>Peto de la guardia"
    lore:
      - "<gray>Un escudo para el corazón."
      - "<dark_gray>El óxido no tiene sitio aquí."
  gilded_blade:
    name: "<blue>Espada dorada"
    lore:
      - "<gray>Más brillo que utilidad."
      - "<dark_gray>Pero a veces el brillo lo es todo."
  tempered_leggings:
    name: "<dark_purple>Grebas del templado"
    lore:
