# Deutsch. MiniMessage-Format: https://docs.advntr.dev/minimessage/format
# Ein leerer Text schaltet eine Nachricht ab. Fehlende Schlüssel kommen aus der
# Standardsprache, danach aus dem Englischen.
#
# Farb-Tags: <pri>, <ok>, <warn>, <err>, <boss>, <num>, <hp>, <xp>, <item>.
# Boss-Platzhalter: <boss_name>, <class> (in ihrer Farbe), <class_color> (startet
# die Klassenfarbe), <level>. <papi:name> zeigt %name% aus PlaceholderAPI für den
# Spieler, der die Nachricht liest.

reloaded: "<pri>[Mo’Bosses]</pri> <ok>Neu geladen.</ok>"
reload_failed: "<pri>[Mo’Bosses]</pri> <warn>Mit Fehlern neu geladen.</warn> <gray>Sieh ins Serverlog.</gray>"
no_permission: "<err>Diesen Befehl darfst du nicht nutzen.</err>"
usage: '<gray>Nutze</gray> <white>/mobosses reload</white><gray>,</gray> <white>/mobosses spawn \<entity> \<level> \<class> [x y z [world]]</white><gray> oder</gray> <white>/mobosses killall</white>'
# <entities>, <classes>: was zur Auswahl steht.
spawn_usage: '<gray>Nutze</gray> <white>/mobosses spawn \<entity> \<level> \<class> [x y z [world]]</white><gray>. Wesen:</gray> <white><entities></white><gray>. Klassen:</gray> <white><classes></white>'
spawned: "<pri>[Mo’Bosses]</pri> <ok>Gespawnt:</ok> <class_color>[Lvl. <level>] [<class>]</class_color> <boss_name>"
# <reason>: warum, etwa das Schutzgebiet, das es verhindert hat.
spawn_failed: "<err>Der Boss lässt sich nicht spawnen:</err> <gray><reason></gray>"
spawn_where: "<err>Gib in der Konsole Koordinaten an:</err> <white>/mobosses spawn zombie 10 rare 0 64 0 world</white>"
unknown_entity: "<err>Einen Bosstyp <entity> gibt es nicht.</err> <gray>Typen:</gray> <white><entities></white>"
unknown_class: "<err>Eine Klasse <class> gibt es nicht.</err> <gray>Klassen:</gray> <white><classes></white>"
bad_level: "<err>Die Stufe muss eine Zahl von 1 bis <max> sein, nicht <level>.</err>"
# <count>: wie viele.
killed_all: "<pri>[Mo’Bosses]</pri> <ok>Bosse entfernt: <num><count></num>.</ok>"
killed_none: "<pri>[Mo’Bosses]</pri> <warn>Es gibt keine Bosse, die du entfernen könntest.</warn>"

# Über dem Kopf des Bosses, jeder liest ihn in seiner Sprache.
boss_tag: "<class_color>[Lvl. <level>] [<class>] <boss_name>"
boss_bar: "<boss_name> <class_color>[Lvl. <level>]"

# An alle, wenn Spieler einen Boss besiegen. <player>: alle, die ihn getroffen haben; <experience>: die Vanilla-Erfahrung, die er fallen ließ.
kill: "<pri>[Mo’Bosses]</pri> <boss><boss_name></boss> <num>Lvl. <level></num>/<class> fällt durch <ok><player></ok> – <xp><experience></xp> Erfahrung!"

# An alle, wenn ein Spieler Beute dieser Klassen bekommt. <player>, <itemstack>: der Gegenstand, mit Tooltip beim Drüberfahren.
loot:
  rare: "<pri>[Mo’Bosses]</pri> <ok><player></ok> erhält <item>seltene</item> Beute: <item><itemstack></item>!"
  epic: "<pri>[Mo’Bosses]</pri> <ok><player></ok> erhält <bold><light_purple>epische</light_purple></bold> Beute: <item><itemstack></item>!"
  legendary: "<pri>[Mo’Bosses]</pri> <ok><player></ok> erhält <bold><gold>legendäre</gold></bold> Beute: <item><itemstack></item>!"
  mythic: "<pri>[Mo’Bosses]</pri> <ok><player></ok> erhält <bold><gradient:#ff0080:#8000ff>mythische</gradient></bold> Beute: <item><itemstack></item>!"

