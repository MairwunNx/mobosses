# English. MiniMessage format: https://docs.advntr.dev/minimessage/format
# An empty text turns a message off. Keys missing here come from the default
# language, then from English.
#
# Color tags: <pri>, <ok>, <warn>, <err>, <boss>, <num>, <hp>, <xp>, <item>.
# Boss placeholders: <boss_name>, <class> (in its color), <class_color> (starts
# the class color), <level>. <papi:name> shows PlaceholderAPI's %name% for the
# player who reads the message.

reloaded: "<pri>[Mo’Bosses]</pri> <ok>Reloaded.</ok>"
reload_failed: "<pri>[Mo’Bosses]</pri> <warn>Reloaded with errors.</warn> <gray>Check the server log.</gray>"
no_permission: "<err>You can’t use this command.</err>"
usage: '<gray>Use</gray> <white>/mobosses</white> <gray>for the menu,</gray> <white>/mobosses info [player]</white><gray>,</gray> <white>/mobosses top</white><gray>; admins:</gray> <white>/mobosses reload</white><gray>,</gray> <white>/mobosses spawn \<entity> \<level> \<class> [x y z [world]]</white><gray>,</gray> <white>/mobosses killall</white>'
# <entities>, <classes>: what there is to pick from.
spawn_usage: '<gray>Use</gray> <white>/mobosses spawn \<entity> \<level> \<class> [x y z [world]]</white><gray>. Entities:</gray> <white><entities></white><gray>. Classes:</gray> <white><classes></white>'
spawned: "<pri>[Mo’Bosses]</pri> <ok>Spawned</ok> <class_color>[Lv. <level>] [<class>]</class_color> <boss_name>"
# <reason>: why, like the protected area that stopped it.
spawn_failed: "<err>Can’t spawn the boss:</err> <gray><reason></gray>"
spawn_where: "<err>From the console, give coordinates:</err> <white>/mobosses spawn zombie 10 rare 0 64 0 world</white>"
unknown_entity: "<err>There’s no boss type <entity>.</err> <gray>Types:</gray> <white><entities></white>"
unknown_class: "<err>There’s no class <class>.</err> <gray>Classes:</gray> <white><classes></white>"
bad_level: "<err>The level must be a number from 1 to <max>, not <level>.</err>"
# <count>: how many.
killed_all: "<pri>[Mo’Bosses]</pri> <ok>Bosses removed: <num><count></num>.</ok>"
killed_none: "<pri>[Mo’Bosses]</pri> <warn>There are no bosses to remove.</warn>"
player_not_found: "<err>No player named <player> has played here.</err>"
no_database: "<warn>Statistics need the database, and it isn’t open right now.</warn>"

# /mobosses info. <player>, <level>, <max>, <rank> (on the board), <experience>, <kills>, <cooldown> (until a boss may spawn near them).
info: |-
  <pri>Mo’Bosses</pri> <dark_gray>·</dark_gray> <white><player></white>
  <gray>Level</gray> <num><level></num><dark_gray>/<max></dark_gray> <dark_gray>·</dark_gray> <gray>Rank</gray> <num>#<rank></num>
  <gray>Experience</gray> <xp><experience></xp> <dark_gray>·</dark_gray> <gray>Bosses killed</gray> <num><kills></num>
  <gray>Next boss near you</gray> <white><cooldown></white>
info_ready: "any moment"

# /mobosses top and the menu. <rank>, <player>, <level>, <kills>.
top:
  header: "<pri>Mo’Bosses</pri> <dark_gray>·</dark_gray> <gray>the best hunters</gray>"
  line: "<num>#<rank></num> <white><player></white> <dark_gray>·</dark_gray> <gray>level</gray> <num><level></num> <dark_gray>·</dark_gray> <gray>kills</gray> <num><kills></num>"
  empty: "<gray>No hunters yet. Be the first.</gray>"

# The /mobosses menu. The card's lines come from info above; <alive> is the bosses around now.
menu:
  title: "Mo’Bosses"
  you: "<white><player></white>"
  top: "<gold>The best hunters</gold>"
  bosses: "<boss>Bosses</boss> <gray>· <alive> around now</gray>"
  bosses_line: "<class><gray>: spawned</gray> <num><spawned></num><gray>, killed</gray> <num><killed></num>"
  reload: "<green>Reload Mo’Bosses</green>"
  killall: "<red>Remove every boss</red>"
  close: "<gray>Close</gray>"

# Over the boss's head, each player reads it in their own language.
boss_tag: "<class_color>[Lv. <level>] [<class>] <boss_name>"
boss_bar: "<boss_name> <class_color>[Lv. <level>]"

# To the players near a new boss of broadcast.spawns_from or rarer.
boss_nearby: "<pri>[Mo’Bosses]</pri> <warn>A boss appeared nearby:</warn> <class_color>[Lv. <level>] [<class>]</class_color> <boss><boss_name></boss>"

# To everyone when players kill a boss. <player>: everyone who hit it; <experience>: the vanilla experience it dropped.
kill: "<pri>[Mo’Bosses]</pri> <ok><player></ok> defeated <boss><boss_name></boss> <num>Lv. <level></num>/<class> for <xp><experience></xp> experience!"

# To everyone when a player gets loot of these classes. <player>, <itemstack>: the item, with its tooltip on hover.
loot:
  rare: "<pri>[Mo’Bosses]</pri> <ok><player></ok> got <item>rare</item> loot: <item><itemstack></item>!"
  epic: "<pri>[Mo’Bosses]</pri> <ok><player></ok> got <bold><light_purple>epic</light_purple></bold> loot: <item><itemstack></item>!"
  legendary: "<pri>[Mo’Bosses]</pri> <ok><player></ok> got <bold><gold>legendary</gold></bold> loot: <item><itemstack></item>!"
  mythic: "<pri>[Mo’Bosses]</pri> <ok><player></ok> got <bold><gradient:#ff0080:#8000ff>mythic</gradient></bold> loot: <item><itemstack></item>!"

