###############################################################################
#                          Mo’Bosses rewards                                  #
###############################################################################
# Potion effects for each player who deals enough of a boss's health: a few
# picked from the pool of the boss's class, plus absorption hearts. Durations
# and strength grow with the boss's level. Effect ids like SPEED or
# minecraft:speed; amplifier 0 is level I.

enabled: true
extinguish_player: true    # Puts out a burning player.
cleanse_negatives: true    # Clears poison, wither, slowness, and the like first.
min_damage_share: 0.27777777   # The share of the boss's health a player must deal.

base_duration_seconds: 8
duration_per_level: 0.60
max_duration_seconds: 60

amplifier_base: 0
amplifier_per_level: 0.035
amplifier_max: 3

# After rewards, a player waits this long before the next ones: the duration
# times the multiplier, kept between the two limits, in seconds.
cooldown_multiplier: 2.0
cooldown_min_seconds: 8
cooldown_max_seconds: 180

# By class: how many effects (between effects_min and effects_max), extra
# absorption hearts (each 2 is a level of Absorption), and the pool to pick from.
tiers:
  common:
    effects_min: 1
    effects_max: 1
    extra_absorption_hearts: 0
    effect_pool: [ SPEED, HASTE, REGENERATION ]
  uncommon:
    effects_min: 1
    effects_max: 2
    extra_absorption_hearts: 0
    effect_pool: [ REGENERATION, HASTE, WATER_BREATHING, NIGHT_VISION, JUMP_BOOST ]
  rare:
    effects_min: 2
    effects_max: 2
    extra_absorption_hearts: 2
    effect_pool: [ SPEED, HASTE, REGENERATION, RESISTANCE, FIRE_RESISTANCE, LUCK ]
  epic:
    effects_min: 2
    effects_max: 3
    extra_absorption_hearts: 4
    effect_pool: [ SPEED, HASTE, REGENERATION, RESISTANCE, FIRE_RESISTANCE, DOLPHINS_GRACE, CONDUIT_POWER ]
  legendary:
    effects_min: 3
    effects_max: 3
    extra_absorption_hearts: 6
    effect_pool: [ SPEED, HASTE, REGENERATION, RESISTANCE, FIRE_RESISTANCE, DOLPHINS_GRACE, CONDUIT_POWER ]
  mythic:
    effects_min: 3
    effects_max: 4
    extra_absorption_hearts: 8
    effect_pool: [ SPEED, HASTE, REGENERATION, RESISTANCE, FIRE_RESISTANCE, STRENGTH, DOLPHINS_GRACE, CONDUIT_POWER, SATURATION ]
