###############################################################################
#                          Mo’Bosses configuration                            #
###############################################################################
# Every key here has a default, so you can delete the ones you don't change.
# A value that doesn't fit (a word where a number goes) costs only itself: the
# log says which one, and it takes its default. /mobosses reload applies changes
# without a restart. Messages live in lang/<language>.yml.

enabled: true   # false stops new bosses and abilities; bosses already around stay.
debug: false    # true logs spawns, levels, abilities, and loot.

locales:
  # Players nothing else matches, the console, and the name tags over bosses get
  # this language. A name tag is the same for everyone who sees it.
  default: en
  # Where a player's language comes from, tried in order:
  #   ip     — the country of their IP address, through the lists below;
  #   client — the language set in their game, when a lang/ file matches it.
  sources: [ ip, client ]
  # Language → the ISO 3166 country codes that get it. Add a lang/it.yml and an
  # “it: [ IT, SM, VA ]” line to add Italian.
  countries:
    ru: [ RU, BY, KZ, KG, TJ, UZ, AM, AZ, MD, GE, TM ]
    es: [ ES, MX, AR, CO, CL, PE, VE, EC, GT, CU, BO, DO, HN, PY, SV, NI, CR, PA, UY, PR, GQ ]
    pt: [ BR, PT, AO, MZ, CV, GW, ST, TL ]
    de: [ DE, AT, CH, LI, LU ]

geoip:
  # The country database: DB-IP's free “IP to Country Lite”, CC BY 4.0, about 4 MB.
  # The plugin downloads it into geoip/ and refreshes it once it's older than
  # refresh_days. Lookups happen on your server; no address leaves it.
  enabled: true
  url: "https://download.db-ip.com/free/dbip-country-lite-{year}-{month}.mmdb.gz"
  refresh_days: 30

# ---------------------------------------------------------------------------
#  Spawning
# ---------------------------------------------------------------------------
# A mob of a type in bosses.yml becomes a boss with that type's spawn_chance,
# times the multipliers below, when a player is within spawn_radius. The nearest
# player's Mo’Bosses level sets the boss's level.
spawn:
  enabled: true
  max_bosses_per_world: 10000000   # Loaded bosses per world.
  spawn_radius: 100
  world_multipliers:               # By world name; worlds not listed use 1.0.
    world: 1.0
    world_nether: 1.1
    world_the_end: 1.3
  time_multipliers:
    day: 0.7
    night: 1.0
  weather_multipliers:
    clear: 1.0
    rain: 1.1
    thunder: 1.3
  # Experimental: no boss when the mob and the player are in different zones,
  # one on the surface and the other in a cave, by this many blocks below the top.
  check_vertical_zone: false
  vertical_zone_threshold: 14
  # Spawn reasons that can make a boss. CUSTOM covers minions bosses summon.
  # https://jd.papermc.io/paper/org/bukkit/event/entity/CreatureSpawnEvent.SpawnReason.html
  allowed_spawn_reasons: [ NATURAL, JOCKEY, SPAWNER, TRIAL_SPAWNER, EGG, SPAWNER_EGG, VILLAGE_INVASION, NETHER_PORTAL, DROWNED, RAID, PATROL, COMMAND, CUSTOM ]

# ---------------------------------------------------------------------------
#  Player levels
# ---------------------------------------------------------------------------
progression:
  # A player's level, from the Mo’Bosses experience and kills they've gathered.
  level_curve:
    max_level: 100
    exp_scale: 30.0    # Higher: experience counts for less.
    kill_scale: 20.0   # Lower: kills count for more.
    power: 1.3         # Higher: a steeper climb in the second half.
    offset: 20.0       # Higher: longer at low levels.

  # A minion that rolls into a boss is this many levels below its summoner.
  mini_bosses_level_curve:
    min_delta: 1
    max_delta: 18
    power: 1.15
    offset: 90
    percent_cap: 0.28  # Never more than 28% of the summoner's level.
    jitter: 1          # A random ±1; 0 turns it off.

  # Mo’Bosses experience for a kill, split by each player's share of the damage.
  exp_gain:
    health_factor: 0.01   # Per point of the boss's max health.
    level_factor: 0.005   # Times the level to the power below.
    level_power: 2.0
    rarity_mul: true      # Times the class's experience multiplier.

  # Now and then a boss comes weaker than the player, more often at high levels.
  variance:
    base_chance: 0.15
    extra_chance: 0.45    # Added at level 100.
    min_reduction: 5
    max_reduction: 80
    power: 1.2

# ---------------------------------------------------------------------------
#  Boss stats
# ---------------------------------------------------------------------------
# Each stat is the mob's vanilla value × the class multiplier × a curve by level
# that starts at 1 and approaches max_scale. offset delays the climb, power makes
# it steeper, and flatten (0 to 1) shrinks the class difference at high levels.
formula:
  health:
    max_scale: 20.0
    power: 1.8
    offset: 400.0
    flatten: 0.35
  damage:
    max_scale: 6.0
    power: 1.2
    offset: 600.0
    flatten: 0.40
  # The vanilla experience a boss drops.
  experience:
    max_scale: 270.0
    power: 2.0
    offset: 1000.0
  # Armor and toughness apply to bosses without an armor set from bosses.yml.
  armor:
    max_scale: 2.0
    power: 1.2
    offset: 180.0
    flatten: 0.35
    cap_points: 28
  toughness:
    max_scale: 2.2
    power: 1.1
    offset: 200.0
    flatten: 0.30
    cap_points: 12
  # How many minions a summon brings.
  minions:
    base_count: 2
    max_count: 12
    power: 1.2
    offset: 80.0
    variance: 0.15   # ±15%.

# ---------------------------------------------------------------------------
#  Looks
# ---------------------------------------------------------------------------
effects:
  particles:
    enabled: true
    update_interval: 20   # Ticks between puffs of the boss's particles.
  glow:
    enabled: true
    classes: [ uncommon, rare, epic, legendary, mythic ]   # An empty list means all.
  visibility_radius: 32   # Glow and particles show only with a player this close.

boss_bar:
  enabled: true
  # PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, or NOTCHED_20.
  style: NOTCHED_20
  hide_distance: 64   # A player farther than this stops seeing the bar.

# ---------------------------------------------------------------------------
#  Loot and messages
# ---------------------------------------------------------------------------
loot:
  # Tools and armor from loottable.yml with random_durability come partly worn.
  random_durability:
    enabled: true
    min_durability: 0.1   # At least 10% of their durability left,
    max_durability: 0.9   # at most 90%; better classes lean toward the top.
  min_damage_share: 0.27777777   # The share of the boss's health a player must deal for loot.

broadcast:
  kills: true       # “kill” to everyone when players kill a boss.
  rare_loot: true   # “loot.*” to everyone for rare, epic, legendary, and mythic loot.
  abilities: true   # “abilities.*” to the player whose hit set an ability off.

kill_sound:
  enabled: true
  key: "minecraft:ui.toast.challenge_complete"

# ---------------------------------------------------------------------------
#  Database
# ---------------------------------------------------------------------------
# Where players' levels live: sqlite (a file here), mysql (MySQL or MariaDB),
# or postgres. A change applies on /mobosses reload.
database:
  type: sqlite
  sqlite:
    file: bosses.db
  mysql:
    host: localhost
    port: 3306
    database: mobosses
    username: root
    password: password
    ssl: false
  postgres:
    host: localhost
    port: 5432
    database: mobosses
    username: mobosses
    password: secret
    ssl: false

# ---------------------------------------------------------------------------
#  Protected areas
# ---------------------------------------------------------------------------
# Each part works only when its plugin runs on the server.
protection:
  griefprevention:
    enabled: true
    no_bosses_in_claims: true            # No boss spawns naturally in a claim.
    no_block_abilities_in_claims: true   # No ability breaks, places, or ignites blocks in a claim.
  worldguard:
    enabled: true
    spawn_flags: true     # Natural spawns follow mobosses-spawn and mob-spawning.
    ability_flags: true   # Block-changing abilities follow mobosses-abilities and build.
    damage_flags: true    # Ability damage to players follows mob-damage.
  admin_spawn_bypass: true   # /mobosses spawn works anywhere; false makes it ask too.

# Block changes by bosses, their abilities, and their minions go to CoreProtect
# under this user, so /co rollback u:#mobosses t:1h r:50 undoes them.
coreprotect:
  enabled: true
  user: "#mobosses"
