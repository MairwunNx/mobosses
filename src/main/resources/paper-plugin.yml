name: MoBosses
version: '${version}'
main: ru.mairwunnx.mobosses.MoBossesPlugin
api-version: '26.3'
load: POSTWORLD
authors: [ MairwunNx ]
description: "Ordinary mobs spawn as bosses of six classes, with abilities, minions, health bars, loot, and player levels, each player reading it in their own language."
website: "https://github.com/MairwunNx/mobosses"
permissions:
  mobosses.use:
    description: Open the /mobosses menu and use /mobosses info and /mobosses top
    default: true
  mobosses.info.others:
    description: Use /mobosses info on other players
    default: op
  mobosses.reset:
    description: Wipe your own level, experience, and kills with /mobosses reset or the menu
    default: true
  mobosses.reset.others:
    description: Wipe another player's progress with /mobosses reset <player>
    default: op
  mobosses.admin:
    description: Use every /mobosses command
    default: op
    children:
      mobosses.use: true
      mobosses.info.others: true
      mobosses.reset: true
      mobosses.reset.others: true
      mobosses.bosses: true
      mobosses.reload: true
      mobosses.spawn: true
      mobosses.killall: true
  mobosses.bosses:
    description: See the bosses in the world in the menu, and go to or remove them
    default: op
  mobosses.reload:
    description: Use /mobosses reload
    default: op
  mobosses.spawn:
    description: Use /mobosses spawn
    default: op
  mobosses.killall:
    description: Use /mobosses killall
    default: op
dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    Plan:
      load: BEFORE
      required: false
      join-classpath: true
    MiniPlaceholders:
      load: BEFORE
      required: false
      join-classpath: true
    GriefPrevention:
      load: BEFORE
      required: false
      join-classpath: true
    WorldGuard:
      load: BEFORE
      required: false
      join-classpath: true
    CoreProtect:
      load: BEFORE
      required: false
      join-classpath: true
