# Русский. Формат MiniMessage: https://docs.advntr.dev/minimessage/format
# Пустой текст отключает сообщение. Ключи, которых здесь нет, берутся из языка
# по умолчанию, затем из английского.
#
# Теги цветов: <pri>, <ok>, <warn>, <err>, <boss>, <num>, <hp>, <xp>, <item>.
# Подстановки босса: <boss_name>, <class> (в его цвете), <class_color> (включает
# цвет класса), <level>. <papi:name> показывает %name% из PlaceholderAPI для
# игрока, который читает сообщение.

reloaded: "<pri>[Mo’Bosses]</pri> <ok>Перезагружено.</ok>"
reload_failed: "<pri>[Mo’Bosses]</pri> <warn>Перезагружено с ошибками.</warn> <gray>Подробности в логе сервера.</gray>"
no_permission: "<err>Вам недоступна эта команда.</err>"
usage: '<gray>Команды:</gray> <white>/mobosses</white><gray> — меню,</gray> <white>/mobosses info [player]</white><gray>,</gray> <white>/mobosses top</white><gray>,</gray> <white>/mobosses reset</white><gray>,</gray> <white>/mobosses language [code|auto]</white><gray>; для админов:</gray> <white>/mobosses reload</white><gray>,</gray> <white>/mobosses spawn \<entity> \<level> \<class> [x y z [world]]</white><gray> и</gray> <white>/mobosses killall</white>'
# <entities>, <classes>: из чего можно выбрать.
spawn_usage: '<gray>Команда:</gray> <white>/mobosses spawn \<entity> \<level> \<class> [x y z [world]]</white><gray>. Существа:</gray> <white><entities></white><gray>. Классы:</gray> <white><classes></white>'
spawned: "<pri>[Mo’Bosses]</pri> <ok>Призван</ok> <class_color>[Ур. <level>] [<class>]</class_color> <boss_name>"
# <reason>: почему не вышло, например защищённая зона.
spawn_failed: "<err>Не удалось призвать босса:</err> <gray><reason></gray>"
spawn_where: "<err>Из консоли укажите координаты:</err> <white>/mobosses spawn zombie 10 rare 0 64 0 world</white>"
unknown_entity: "<err>Босса типа <entity> нет.</err> <gray>Типы:</gray> <white><entities></white>"
unknown_class: "<err>Класса <class> нет.</err> <gray>Классы:</gray> <white><classes></white>"
bad_level: "<err>Уровень — число от 1 до <max>, а не <level>.</err>"
# <count>: сколько.
killed_all: "<pri>[Mo’Bosses]</pri> <ok>Убрано боссов: <num><count></num>.</ok>"
killed_none: "<pri>[Mo’Bosses]</pri> <warn>Боссов нет, убирать некого.</warn>"
player_not_found: "<err>Игрок <player> здесь ещё не играл.</err>"
no_database: "<warn>Статистике нужна база данных, а она сейчас недоступна.</warn>"

# /mobosses info. <player>, <level>, <max>, <rank> (место в таблице), <experience>, <kills>, <cooldown> (сколько ждать босса рядом с игроком), <bonus>, <hours>, <minutes> (бонус выживания).
info: |-
  <pri>Mo’Bosses</pri> <dark_gray>·</dark_gray> <white><player></white>
  <gray>Уровень</gray> <num><level></num><dark_gray>/<max></dark_gray> <dark_gray>·</dark_gray> <gray>Место</gray> <num>#<rank></num>
  <gray>Опыт</gray> <xp><experience></xp> <dark_gray>·</dark_gray> <gray>Убито боссов</gray> <num><kills></num>
  <gray>Следующий босс рядом</gray> <white><cooldown></white>
  <gray>Бонус выживания</gray> <num>+<bonus>%</num> <dark_gray>· <hours> ч <minutes> мин без смертей</dark_gray>
info_ready: "в любой момент"
survival_lost: "<pri>[Mo’Bosses]</pri> <warn>Бонус выживания сгорел: +<bonus>% к боссам за <hours> ч <minutes> мин без смертей.</warn>"
death_penalty: "<pri>[Mo’Bosses]</pri> <warn>Вы пали от</warn> <boss><boss_name></boss><warn>: прогресс к <next>-му уровню сгорел, −<lost> опыта Mo’Bosses.</warn> <gray>Уровень остаётся.</gray>"
full_moon: "<pri>[Mo’Bosses]</pri> <boss>Взошла полная луна.</boss> <gray>Этой ночью боссов больше, а редкие приходят ещё чаще.</gray>"
# Над хотбаром у всех, кто бьёт босса, когда к бою присоединяется ещё один игрок. <players>, <percent> (здоровья сверх своего).
group_health: "<boss><boss_name></boss> <warn>крепнет: бойцов <players>, +<percent>% здоровья</warn>"

# /mobosses reset. <player>: чей прогресс сбросил админ.
reset:
  ask: "<pri>[Mo’Bosses]</pri> <warn>Это сотрёт ваш уровень, опыт и убийства и уберёт вас из таблицы. Отменить нельзя.</warn> <gray>Чтобы продолжить:</gray> <click:run_command:'/mobosses reset confirm'><white>/mobosses reset confirm</white></click>"
  done: "<pri>[Mo’Bosses]</pri> <ok>Прогресс сброшен: вы снова на 1-м уровне.</ok>"
  done_other: "<pri>[Mo’Bosses]</pri> <ok>Прогресс игрока <player> сброшен.</ok>"

# /mobosses top и меню. <rank>, <player>, <level>, <kills>.
top:
  header: "<pri>Mo’Bosses</pri> <dark_gray>·</dark_gray> <gray>лучшие охотники</gray>"
  line: "<num>#<rank></num> <white><player></white> <dark_gray>·</dark_gray> <gray>уровень</gray> <num><level></num> <dark_gray>·</dark_gray> <gray>убийств</gray> <num><kills></num>"
  empty: "<gray>Охотников пока нет. Станьте первым.</gray>"

# Меню /mobosses. Строки карточки берутся из info выше; <alive> — сколько боссов живо сейчас.
menu:
  title: "Mo’Bosses"
  you: "<white><player></white>"
  top: "<gold>Лучшие охотники</gold>"
  bosses: "<boss>Боссы</boss> <gray>· сейчас живы: <alive></gray>"
  bosses_line: "<class><gray>: призвано</gray> <num><spawned></num><gray>, убито</gray> <num><killed></num>"
  # Первая строка — название кнопки, остальные — её описание.
  reset: |-
    <red>Начать заново</red>
    <gray>Сотрёт уровень, опыт и убийства.</gray>
  reset_confirm: |-
    <red><b>Нажмите ещё раз, чтобы начать заново</b></red>
    <gray>Отменить нельзя.</gray>
  reload: "<green>Перезагрузить Mo’Bosses</green>"
  killall: "<red>Убрать всех боссов</red>"
  close: "<gray>Закрыть</gray>"
  bestiary: |-
    <gold>Бестиарий</gold>
    <gray>Побеждённые вами боссы, по видам и классам.</gray>
  boss_list: |-
    <aqua>Боссы в мире</aqua>
    <gray>Сначала ближайшие: подробности, телепорт или удаление.</gray>
  back: "<gray>Назад</gray>"
  previous: "<gray>Предыдущая страница</gray>"
  next: "<gray>Следующая страница</gray>"
  language: |-
    <aqua>Язык</aqua>
    <gray>Сейчас:</gray> <white><language></white>
    <dark_gray>Выберите, на каком языке с вами говорит Mo’Bosses.</dark_gray>

# /mobosses language и его страница. <language> — название языка на нём самом, <languages> — какие есть.
language:
  set: "<pri>[Mo’Bosses]</pri> <ok>Теперь Mo’Bosses говорит с вами на языке: <language>.</ok>"
  auto: "<pri>[Mo’Bosses]</pri> <ok>Mo’Bosses снова выбирает язык сам, пока это <language>.</ok> <gray>Он смотрит на вашу страну и язык игры.</gray>"
  unknown: "<err>Языка <language> нет.</err> <gray>Есть:</gray> <white><languages></white><gray> и</gray> <white>auto</white>"
  title: "Язык"
  automatic: |-
    <yellow>Автоматически</yellow>
    <gray>По вашей стране и языку игры.</gray>
  current: "<green>Ваш язык сейчас</green>"
  pick: "<gray>Нажмите, чтобы выбрать</gray>"

# Экран настроек в игре с модом: Mod Menu, список модов NeoForge или в мире. <default> — значение по умолчанию.
settings:
  title: "Настройки Mo’Bosses"
  search: "Поиск"
  default: "<gray>По умолчанию:</gray> <white><default></white>"
  denied: "<err>Вам нельзя менять настройки этого сервера.</err>"
  elsewhere: "<gray>На этом сервере Mo’Bosses не мод: его настройки живут на сервере.</gray>"
  local: "<gray>Изменения коснутся миров, которые вы откроете дальше.</gray>"
  waiting: "<gray>Спрашиваем сервер…</gray>"
  done: "Готово"

# Страницы лута боссов в JEI, REI и EMI. <class> — самый низкий класс, с которого падает; <min>, <max> — уровни босса; <bosses> — виды боссов; <percent>.
loot_page:
  title: "Лут боссов"
  class: "<gray>С боссов</gray> <class> <gray>и выше</gray>"
  levels: "<gray>Уровни босса</gray> <white><min>–<max></white>"
  bosses: "<gray>Только</gray> <white><bosses></white>"
  every_boss: "<gray>С любого босса</gray>"
  odds: "<gray>Около</gray> <white><percent>%</white> <gray>добычи босса класса</gray> <class>"

# Страница бестиария. <class>, <kills>, <level> (лучший); <opened> и <total> — клетки «вид × класс».
bestiary:
  title: "Бестиарий"
  unknown: |-
    <dark_gray>???</dark_gray>
    <gray>Ещё не побеждён.</gray>
  missing: "<class><dark_gray>: —</dark_gray>"
  line: "<class><gray>: побеждено</gray> <num><kills></num><gray>, лучший уровень</gray> <num><level></num>"
  progress: |-
    <gold>Открыто <opened> из <total></gold>
    <gray>Каждый вид в каждом классе считается один раз.</gray>

# Список боссов для админов. Теги босса, <health>, <max>, <world>, <x>, <y>, <z>,
# <distance> (в блоках, «—» в другом мире), <fighters>, <phase> (вторая фаза), <spawner>.
boss_list:
  title: "Боссы: <count> · стр. <page>/<pages>"
  lore: |-
    <gray>Здоровье</gray> <num><health></num><dark_gray>/<max></dark_gray>
    <gray><world> <x> <y> <z> · в <distance> блоках</gray>
    <gray>Бойцов</gray> <num><fighters></num> <dark_gray>·</dark_gray> <gray>вторая фаза:</gray> <phase>
    <dark_gray>ЛКМ — подробности · Shift+ЛКМ — телепорт · ПКМ — убрать</dark_gray>
  info: |-
    <pri>[Mo’Bosses]</pri> <class_color>[Ур. <level>] [<class>]</class_color> <boss_name>
    <gray>Здоровье</gray> <num><health></num><dark_gray>/<max></dark_gray> <dark_gray>·</dark_gray> <gray><world> <x> <y> <z>, в <distance> блоках</gray>
    <gray>Бойцов</gray> <num><fighters></num> <dark_gray>·</dark_gray> <gray>вторая фаза:</gray> <phase> <dark_gray>·</dark_gray> <gray>из спавнера:</gray> <spawner>
  confirm: |-
    <red><b>ПКМ ещё раз — убрать</b></red>
    <gray>Без добычи и опыта.</gray>
  gone: "<warn>Этого босса уже нет.</warn>"
  removed: "<pri>[Mo’Bosses]</pri> <ok>Убран</ok> <class_color>[Ур. <level>] [<class>]</class_color> <boss_name>"
  teleported: "<pri>[Mo’Bosses]</pri> <gray>Вы рядом с</gray> <class_color>[Ур. <level>] [<class>]</class_color> <boss_name>"
  empty: |-
    <gray>В загруженных чанках боссов нет</gray>
    <dark_gray>Боссы в выгруженных появятся, когда те загрузятся.</dark_gray>

words:
  yes: "<green>да</green>"
  no: "<gray>нет</gray>"

# Над головой босса, каждому игроку на его языке.
boss_tag: "<class_color>[Ур. <level>] [<class>] <boss_name>"
boss_bar: "<boss_name> <class_color>[Ур. <level>]"

# Игрокам рядом с новым боссом класса broadcast.spawns_from или реже.
boss_nearby: "<pri>[Mo’Bosses]</pri> <warn>Рядом появился босс:</warn> <class_color>[Ур. <level>] [<class>]</class_color> <boss><boss_name></boss>"

# После убийства каждому участнику, в чат (broadcast.kill_notes): почему он
# получил меньше целого или больше. <boss_level>, <your_level> (его уровень), <percent>,
# <share> (сколько здоровья босса он снял), <kill> и <loot> (сколько нужно),
# <seconds>, <pets> (доля питомцев в его уроне), <weight>.
# header — что игрок получил: босс, <share>, <experience>, <mobosses_experience>.
kill_notes:
  header: "<pri>[Mo’Bosses]</pri> <class_color>[Ур. <level>] [<class>]</class_color> <boss_name> <gray>повержен · ваша доля <share>%:</gray> <xp>+<experience> опыта</xp><gray>,</gray> <xp>+<mobosses_experience> опыта Mo’Bosses</xp>"
  above: "<dark_gray>  ›</dark_gray> <ok>Босс был <boss_level>-го уровня, выше вашего <your_level>-го: +<percent>% опыта.</ok>"
  below: "<dark_gray>  ›</dark_gray> <warn>Босс был <boss_level>-го уровня, ниже вашего <your_level>-го: вы получили <percent>% его опыта.</warn> <gray>Боссы вашего уровня дают весь.</gray>"
  not_counted: "<dark_gray>  ›</dark_gray> <warn>Убийство не засчитано в уровень: босс <boss_level>-го уровня слишком слаб для <your_level>-го.</warn>"
  small_share: "<dark_gray>  ›</dark_gray> <warn>Вы сняли <share>% здоровья босса: для убийства нужно <kill>%, для добычи — <loot>%.</warn>"
  no_loot: "<dark_gray>  ›</dark_gray> <warn>Без добычи: вы сняли <share>% здоровья босса, а нужно <loot>%.</warn>"
  rewards_cooldown: "<dark_gray>  ›</dark_gray> <gray>Зелий-наград на этот раз нет: следующие — через <seconds> с.</gray>"
  spawner: "<dark_gray>  ›</dark_gray> <warn>Босс из спавнера, фарм на одном месте: <percent>% награды.</warn> <gray>Со временем восстановится.</gray>"
  pets: "<dark_gray>  ›</dark_gray> <gray>Ваши питомцы нанесли <pets>% вашего урона; в опыте против этого босса он стоит <weight>%.</gray>"

# Всем, когда игроки убивают босса. <player>: все, кто его бил; <experience>: обычный опыт, который из него выпал.
kill: "<pri>[Mo’Bosses]</pri> <ok><player></ok> побеждает <boss><boss_name></boss> <num>Ур. <level></num>/<class> и получает <xp><experience></xp> опыта!"

# Всем, когда игрок получает добычу этих классов. <player>, <itemstack>: предмет, его описание всплывает при наведении.
loot:
  rare: "<pri>[Mo’Bosses]</pri> <ok><player></ok> получает <item>редкую</item> добычу: <item><itemstack></item>!"
  epic: "<pri>[Mo’Bosses]</pri> <ok><player></ok> получает <bold><light_purple>эпическую</light_purple></bold> добычу: <item><itemstack></item>!"
  legendary: "<pri>[Mo’Bosses]</pri> <ok><player></ok> получает <bold><gold>легендарную</gold></bold> добычу: <item><itemstack></item>!"
  mythic: "<pri>[Mo’Bosses]</pri> <ok><player></ok> получает <bold><gradient:#ff0080:#8000ff>мифическую</gradient></bold> добычу: <item><itemstack></item>!"

