# Português. Formato MiniMessage: https://docs.advntr.dev/minimessage/format
# Um texto vazio desativa a mensagem. As chaves que faltam aqui vêm do idioma
# padrão e, depois, do inglês.
#
# Tags de cor: <pri>, <ok>, <warn>, <err>, <boss>, <num>, <hp>, <xp>, <item>.
# Placeholders do chefe: <boss_name>, <class> (na cor dela), <class_color> (abre
# a cor da classe), <level>. <papi:name> mostra o %name% do PlaceholderAPI para
# o jogador que lê a mensagem.

reloaded: "<pri>[Mo’Bosses]</pri> <ok>Recarregado.</ok>"
reload_failed: "<pri>[Mo’Bosses]</pri> <warn>Recarregado com erros.</warn> <gray>Veja o log do servidor.</gray>"
no_permission: "<err>Você não pode usar este comando.</err>"
usage: '<gray>Use</gray> <white>/mobosses</white> <gray>para o menu,</gray> <white>/mobosses info [player]</white><gray>,</gray> <white>/mobosses top</white><gray>,</gray> <white>/mobosses reset</white><gray>,</gray> <white>/mobosses language [code|auto]</white><gray>; admins:</gray> <white>/mobosses reload</white><gray>,</gray> <white>/mobosses spawn \<entity> \<level> \<class> [x y z [world]]</white><gray> ou</gray> <white>/mobosses killall</white>'
# <entities>, <classes>: as opções disponíveis.
spawn_usage: '<gray>Use</gray> <white>/mobosses spawn \<entity> \<level> \<class> [x y z [world]]</white><gray>. Entidades:</gray> <white><entities></white><gray>. Classes:</gray> <white><classes></white>'
spawned: "<pri>[Mo’Bosses]</pri> <ok>Invocado:</ok> <class_color>[Nv. <level>] [<class>]</class_color> <boss_name>"
# <reason>: o motivo, como a área protegida que impediu a invocação.
spawn_failed: "<err>Não foi possível invocar o chefe:</err> <gray><reason></gray>"
spawn_where: "<err>No console, informe as coordenadas:</err> <white>/mobosses spawn zombie 10 rare 0 64 0 world</white>"
unknown_entity: "<err>Não existe chefe do tipo <entity>.</err> <gray>Tipos:</gray> <white><entities></white>"
unknown_class: "<err>Não existe a classe <class>.</err> <gray>Classes:</gray> <white><classes></white>"
bad_level: "<err>O nível deve ser um número de 1 a <max>, não <level>.</err>"
# <count>: quantos.
killed_all: "<pri>[Mo’Bosses]</pri> <ok>Chefes removidos: <num><count></num>.</ok>"
killed_none: "<pri>[Mo’Bosses]</pri> <warn>Não há chefes para remover.</warn>"
player_not_found: "<err>Nenhum jogador chamado <player> jogou aqui.</err>"
no_database: "<warn>As estatísticas precisam do banco de dados, e ele não está aberto agora.</warn>"

# /mobosses info. <player>, <level>, <max>, <rank> (no placar), <experience>, <next_level> (o caminho até o próximo nível), <kills>, <cooldown> (até um chefe poder surgir perto do jogador), <bonus>, <hours>, <minutes> (o bônus de sobrevivência).
info: |-
  <pri>Mo’Bosses</pri> <dark_gray>·</dark_gray> <white><player></white>
  <gray>Nível</gray> <num><level></num><dark_gray>/<max></dark_gray> <dark_gray>·</dark_gray> <gray>Posição</gray> <num>#<rank></num>
  <next_level>
  <gray>Experiência</gray> <xp><experience></xp> <dark_gray>·</dark_gray> <gray>Chefes derrotados</gray> <num><kills></num>
  <gray>Próximo chefe perto de você</gray> <white><cooldown></white>
  <gray>Bônus de sobrevivência</gray> <num>+<bonus>%</num> <dark_gray>· <hours> h <minutes> min sem morrer</dark_gray>
info_ready: "a qualquer momento"
# <next>, <progress>, <needed>, <percent>.
info_next: "<gray>Até o nível</gray> <num><next></num> <xp><progress></xp><dark_gray>/<needed> · <percent>%</dark_gray>"
info_top: "<gray>Nível máximo:</gray> <ok>não há mais para onde subir</ok>"
survival_lost: "<pri>[Mo’Bosses]</pri> <warn>Seu bônus de sobrevivência acabou: +<bonus>% de chefes depois de <hours> h <minutes> min sem morrer.</warn>"
death_penalty: "<pri>[Mo’Bosses]</pri> <warn>Você caiu para</warn> <boss><boss_name></boss><warn>: seu progresso rumo ao nível <next> queimou, −<lost> de experiência Mo’Bosses.</warn> <gray>Seu nível fica.</gray>"
full_moon: "<pri>[Mo’Bosses]</pri> <boss>A lua cheia nasce.</boss> <gray>Esta noite os chefes vêm mais vezes, e os raros mais ainda.</gray>"
# Acima da barra de todos que lutam contra um chefe quando mais um jogador entra na luta. <players>, <percent> (vida acima da própria).
group_health: "<boss><boss_name></boss> <warn>fica mais forte: <players> lutadores, +<percent>% de vida</warn>"

# /mobosses reset. <player>: de quem um admin apagou o progresso.
reset:
  ask: "<pri>[Mo’Bosses]</pri> <warn>Isto apaga seu nível, sua experiência e seus abates, e tira você do placar. Não dá para desfazer.</warn> <gray>Para continuar:</gray> <click:run_command:'/mobosses reset confirm'><white>/mobosses reset confirm</white></click>"
  done: "<pri>[Mo’Bosses]</pri> <ok>Seu progresso foi apagado: você voltou ao nível 1.</ok>"
  done_other: "<pri>[Mo’Bosses]</pri> <ok>O progresso de <player> foi apagado.</ok>"

# /mobosses top e o menu. <rank>, <player>, <level>, <kills>.
top:
  header: "<pri>Mo’Bosses</pri> <dark_gray>·</dark_gray> <gray>os melhores caçadores</gray>"
  line: "<num>#<rank></num> <white><player></white> <dark_gray>·</dark_gray> <gray>nível</gray> <num><level></num> <dark_gray>·</dark_gray> <gray>abates</gray> <num><kills></num>"
  empty: "<gray>Ainda não há caçadores. Seja o primeiro.</gray>"

# O menu do /mobosses. As linhas do cartão vêm do info acima; <alive> são os chefes vivos agora.
menu:
  title: "Mo’Bosses"
  you: "<white><player></white>"
  top: "<gold>Os melhores caçadores</gold>"
  bosses: "<boss>Chefes</boss> <gray>· <alive> vivos agora</gray>"
  bosses_line: "<class><gray>: surgiram</gray> <num><spawned></num><gray>, derrotados</gray> <num><killed></num>"
  # A primeira linha dá nome ao botão; o resto o descreve.
  reset: |-
    <red>Começar do zero</red>
    <gray>Apaga o nível, a experiência e os abates.</gray>
  reset_confirm: |-
    <red><b>Clique de novo para começar do zero</b></red>
    <gray>Não dá para desfazer.</gray>
  reload: "<green>Recarregar Mo’Bosses</green>"
  killall: "<red>Remover todos os chefes</red>"
  close: "<gray>Fechar</gray>"
  bestiary: |-
    <gold>Bestiário</gold>
    <gray>Os chefes que você derrotou, por tipo e classe.</gray>
  boss_list: |-
    <aqua>Chefes no mundo</aqua>
    <gray>Os mais próximos primeiro: detalhes, teleporte ou remover.</gray>
  back: "<gray>Voltar</gray>"
  previous: "<gray>Página anterior</gray>"
  next: "<gray>Próxima página</gray>"
  language: |-
    <aqua>Idioma</aqua>
    <gray>Agora:</gray> <white><language></white>
    <dark_gray>Escolha em que idioma o Mo’Bosses fala com você.</dark_gray>

# /mobosses language e sua página. <language>: o nome de um idioma nele mesmo; <languages>: os que existem.
language:
  set: "<pri>[Mo’Bosses]</pri> <ok>Agora o Mo’Bosses fala com você em <language>.</ok>"
  auto: "<pri>[Mo’Bosses]</pri> <ok>O Mo’Bosses volta a escolher seu idioma: por enquanto, <language>.</ok> <gray>Ele se guia pelo seu país e pelo idioma do seu jogo.</gray>"
  unknown: "<err>Não existe o idioma <language>.</err> <gray>Idiomas:</gray> <white><languages></white><gray> ou</gray> <white>auto</white>"
  title: "Idioma"
  automatic: |-
    <yellow>Automático</yellow>
    <gray>Pelo seu país e pelo idioma do seu jogo.</gray>
  current: "<green>Seu idioma agora</green>"
  pick: "<gray>Clique para escolher</gray>"

# A tela de ajustes, num jogo com o mod: Mod Menu, a lista de mods do NeoForge ou num mundo. <default>: o valor padrão.
settings:
  title: "Ajustes do Mo’Bosses"
  search: "Buscar"
  default: "<gray>Padrão:</gray> <white><default></white>"
  denied: "<err>Você não pode mudar os ajustes deste servidor.</err>"
  elsewhere: "<gray>Este servidor não roda o Mo’Bosses como mod: os ajustes dele ficam no servidor.</gray>"
  local: "<gray>As mudanças valem para os mundos que você abrir daqui em diante.</gray>"
  waiting: "<gray>Perguntando ao servidor…</gray>"
  done: "Pronto"

# As páginas do saque dos chefes no JEI, REI e EMI. <class>: a classe mais baixa que solta; <min>, <max>: níveis do chefe; <bosses>: os tipos de chefe; <percent>.
loot_page:
  title: "Saque dos chefes"
  class: "<gray>De chefes</gray> <class> <gray>e mais raros</gray>"
  levels: "<gray>Níveis do chefe</gray> <white><min>–<max></white>"
  bosses: "<gray>Só</gray> <white><bosses></white>"
  every_boss: "<gray>Qualquer chefe</gray>"
  odds: "<gray>Cerca de</gray> <white><percent>%</white> <gray>do saque</gray> <class>"

# A página do bestiário. <class>, <kills>, <level> (o melhor); <opened> e <total> casas tipo × classe.
bestiary:
  title: "Bestiário"
  unknown: |-
    <dark_gray>???</dark_gray>
    <gray>Ainda não derrotado.</gray>
  missing: "<class><dark_gray>: —</dark_gray>"
  line: "<class><gray>: derrotados</gray> <num><kills></num><gray>, melhor nível</gray> <num><level></num>"
  progress: |-
    <gold><opened> de <total> descobertos</gold>
    <gray>Cada tipo conta uma vez em cada classe.</gray>

# A lista de chefes para admins. As tags do chefe, <health>, <max>, <world>, <x>, <y>, <z>,
# <distance> (blocos, — em outro mundo), <fighters>, <phase> (segunda fase), <spawner>.
boss_list:
  title: "Chefes: <count> · pág. <page>/<pages>"
  lore: |-
    <gray>Vida</gray> <num><health></num><dark_gray>/<max></dark_gray>
    <gray><world> <x> <y> <z> · a <distance> blocos</gray>
    <gray>Lutadores</gray> <num><fighters></num> <dark_gray>·</dark_gray> <gray>segunda fase:</gray> <phase>
    <dark_gray>Clique: detalhes · Shift+clique: teleporte · Clique direito: remover</dark_gray>
  info: |-
    <pri>[Mo’Bosses]</pri> <class_color>[Nv. <level>] [<class>]</class_color> <boss_name>
    <gray>Vida</gray> <num><health></num><dark_gray>/<max></dark_gray> <dark_gray>·</dark_gray> <gray><world> <x> <y> <z>, a <distance> blocos</gray>
    <gray>Lutadores</gray> <num><fighters></num> <dark_gray>·</dark_gray> <gray>segunda fase:</gray> <phase> <dark_gray>·</dark_gray> <gray>de um spawner:</gray> <spawner>
  confirm: |-
    <red><b>Outro clique direito para remover</b></red>
    <gray>Sem saque nem experiência.</gray>
  gone: "<warn>Esse chefe já não está mais lá.</warn>"
  removed: "<pri>[Mo’Bosses]</pri> <ok>Removido:</ok> <class_color>[Nv. <level>] [<class>]</class_color> <boss_name>"
  teleported: "<pri>[Mo’Bosses]</pri> <gray>Você está ao lado de</gray> <class_color>[Nv. <level>] [<class>]</class_color> <boss_name>"
  empty: |-
    <gray>Nenhum chefe em chunks carregados</gray>
    <dark_gray>Os de chunks não carregados aparecem quando eles carregam.</dark_gray>

words:
  yes: "<green>sim</green>"
  no: "<gray>não</gray>"

# Acima da cabeça do chefe, cada jogador lê no próprio idioma.
boss_tag: "<class_color>[Nv. <level>] [<class>] <boss_name>"
boss_bar: "<boss_name> <class_color>[Nv. <level>]"

# Para os jogadores perto de um chefe novo da classe broadcast.spawns_from ou mais rara.
boss_nearby: "<pri>[Mo’Bosses]</pri> <warn>Um chefe surgiu por perto:</warn> <class_color>[Nv. <level>] [<class>]</class_color> <boss><boss_name></boss>"

# Depois de um abate, para cada jogador que participou, no chat
# (broadcast.kill_notes): por que recebeu menos que tudo, ou mais. <boss_level>,
# <your_level> (o dele), <percent>, <share> (a vida do chefe que tirou), <kill> e <loot>
# (o que é preciso), <seconds>, <pets> (a parte dos pets no dano dele), <weight>.
# header: o que recebeu, com o chefe, <share>, <experience>, <mobosses_experience>.
kill_notes:
  header: "<pri>[Mo’Bosses]</pri> <class_color>[Nv. <level>] [<class>]</class_color> <boss_name> <gray>derrotado · sua parte <share>%:</gray> <xp>+<experience> de experiência</xp><gray>,</gray> <xp>+<mobosses_experience> do Mo’Bosses</xp>"
  above: "<dark_gray>  ›</dark_gray> <ok>O chefe era nível <boss_level>, acima do seu <your_level>: +<percent>% de experiência.</ok>"
  below: "<dark_gray>  ›</dark_gray> <warn>O chefe era nível <boss_level>, abaixo do seu <your_level>: você recebeu <percent>% da experiência dele.</warn> <gray>Chefes do seu nível dão tudo.</gray>"
  not_counted: "<dark_gray>  ›</dark_gray> <warn>Não conta como abate: um chefe nível <boss_level> é fraco demais para o nível <your_level>.</warn>"
  small_share: "<dark_gray>  ›</dark_gray> <warn>Você tirou <share>% da vida do chefe: um abate pede <kill>% e o saque <loot>%.</warn>"
  no_loot: "<dark_gray>  ›</dark_gray> <warn>Sem saque: você tirou <share>% da vida do chefe, e o saque pede <loot>%.</warn>"
  rewards_cooldown: "<dark_gray>  ›</dark_gray> <gray>Desta vez não há poções de recompensa: as próximas vêm em <seconds> s.</gray>"
  spawner: "<dark_gray>  ›</dark_gray> <warn>Um chefe de spawner, farmado num só lugar: <percent>% da recompensa.</warn> <gray>Ela volta com o tempo.</gray>"
  pets: "<dark_gray>  ›</dark_gray> <gray>Seus pets causaram <pets>% do seu dano; contra este chefe ele vale <weight>% na experiência.</gray>"

# Para todos quando jogadores matam um chefe. <player>: todos que o atingiram; <experience>: a experiência vanilla que ele deixou cair.
kill: "<pri>[Mo’Bosses]</pri> <ok><player></ok> derrotou <boss><boss_name></boss> <num>Nv. <level></num>/<class> e ganhou <xp><experience></xp> de experiência!"

# Para todos quando um jogador recebe saque destas classes. <player>, <itemstack>: o item, com a descrição ao passar o mouse.
loot:
  rare: "<pri>[Mo’Bosses]</pri> <ok><player></ok> conseguiu um saque <item>raro</item>: <item><itemstack></item>!"
  epic: "<pri>[Mo’Bosses]</pri> <ok><player></ok> conseguiu um saque <bold><light_purple>épico</light_purple></bold>: <item><itemstack></item>!"
  legendary: "<pri>[Mo’Bosses]</pri> <ok><player></ok> conseguiu um saque <bold><gold>lendário</gold></bold>: <item><itemstack></item>!"
  mythic: "<pri>[Mo’Bosses]</pri> <ok><player></ok> conseguiu um saque <bold><gradient:#ff0080:#8000ff>mítico</gradient></bold>: <item><itemstack></item>!"

