  trident_storm: "<boss><boss_name></boss> arremessa <item>tridentes</item>!"
  fang_line: "<boss><boss_name></boss> faz <item>presas</item> brotarem do chão!"
  whirlwind: "<boss><boss_name></boss> gira num <item>redemoinho</item>!"
  wither_aura: "<boss><boss_name></boss> exala uma <item>nuvem definhante</item>!"
