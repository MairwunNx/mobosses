###############################################################################
#                          Mo’Bosses abilities                                #
###############################################################################
# A boss casts an ability when a player hits it: a random one among those its
# class has reached the level for (ability_thresholds in classes.yml), once the
# shared cooldown and the ability's own cooldown have passed. Cooldowns are in
# milliseconds; a bias stretches each one by a random factor between 1 and the
# bias. Abilities hurt players in survival or adventure only, and change blocks
# only where the protection settings in config.yml allow it. Aimed abilities
# go for the players the boss fights: the one it chases, the one who hit it,
# then everyone who hit it in the last 30 seconds, nearest first; never a
# bystander.

is_lightning_enabled: true
is_summoning_enabled: true
is_regeneration_enabled: true
is_fire_ring_enabled: true
is_web_ring_enabled: true
is_teleport_strike_enabled: true
is_meteor_shower_enabled: true
is_arrow_arc_enabled: true
is_arrow_rain_enabled: true

# ---------------------------------------------------------------------------
#  Cooldowns
# ---------------------------------------------------------------------------
general_cooldown: 5000
general_cooldown_bias: 1.4
lightning_cooldown: 10000
lightning_cooldown_bias: 1.5
summoning_cooldown: 20000
summoning_cooldown_bias: 1.2
regeneration_cooldown: 30000
regeneration_cooldown_bias: 1.1
fire_ring_cooldown: 6000
fire_ring_cooldown_bias: 1.3
web_ring_cooldown: 8000
web_ring_cooldown_bias: 1.4
teleport_strike_cooldown: 11000
teleport_strike_cooldown_bias: 1.2

# ---------------------------------------------------------------------------
#  Lightning: a bolt on every player the boss fights, however far, the rest
#  within the radius around them; a lightning rod or copper next to a player
#  draws that player's bolt. Each value grows by its modifier per boss level,
#  up to max.
# ---------------------------------------------------------------------------
lightning_damage: 5.0
lightning_damage_modifier: 0.1
lightning_damage_max: 20.0
lightning_radius: 3.0
lightning_radius_modifier: 0.05
lightning_radius_max: 10.0
lightning_strikes: 6
lightning_strikes_modifier: 0.1
lightning_strikes_max: 26

# ---------------------------------------------------------------------------
#  Regeneration: regeneration and resistance on the boss for a while.
#  Durations in seconds; amplifier 0 is level I.
# ---------------------------------------------------------------------------
regeneration_duration_bias: 1.4
regen_duration_seconds_base: 8
regen_duration_seconds_per_level: 0.2
regen_duration_seconds_max: 20
regen_amplifier_base: 0
regen_amplifier_per_level: 0.1
regen_amplifier_max: 3
regen_aura_radius: 4.0
regen_extra_resistance_seconds: 6
regen_cleanse_negatives: true   # Clears the boss's negative effects and fire.
regen_anti_projectiles: true    # Burns arrows in the aura; tridents pass.
regen_slow_players: true        # Slows players in the aura.

# ---------------------------------------------------------------------------
#  Fire ring: fire on the ground around the player the boss fights.
# ---------------------------------------------------------------------------
fire_ring_min_radius: 4.0
fire_ring_max_radius: 7.0
fire_ring_density: 0.7   # The share of the ring's 64 points that catch fire.
fire_ring_seconds: 6      # Seconds before the fire goes out.

# ---------------------------------------------------------------------------
#  Web ring: cobwebs around the player the boss fights, and slowness for
#  players inside.
# ---------------------------------------------------------------------------
web_ring_radius: 3.0
web_ring_duration: 8                  # Seconds before the cobwebs go.
web_ring_potion_enabled: true
web_ring_potion_base_duration: 4      # Seconds of slowness,
web_ring_potion_max_duration: 10
web_ring_potion_level_modifier: 0.06  # plus this per boss level.

# ---------------------------------------------------------------------------
#  Meteor shower: waves of burning blocks over the player the boss fights.
# ---------------------------------------------------------------------------
meteor_shower_cooldown: 16000
meteor_shower_cooldown_bias: 1.2
meteor_shower_waves_base: 2
meteor_shower_waves_per_level: 0.03
meteor_shower_waves_max: 7
meteor_shower_wave_interval_ticks: 20
meteor_shower_meteors_per_wave_base: 6
meteor_shower_meteors_per_wave_per_level: 0.08
meteor_shower_meteors_per_wave_max: 20
meteor_shower_height: 18.0
meteor_shower_fall_speed: 1.2
meteor_shower_meteor_lifetime_seconds: 8
meteor_shower_impact_damage_base: 4.0
meteor_shower_impact_damage_per_level: 0.12
meteor_shower_impact_damage_max: 18.0
meteor_shower_fire_radius: 2.5
meteor_shower_ignite_seconds: 3

# ---------------------------------------------------------------------------
#  Arrow arc: rings of arrows out of the boss in every direction.
# ---------------------------------------------------------------------------
arrow_arc_cooldown: 7000
arrow_arc_cooldown_bias: 1.1
arrow_arc_arrows_base: 18
arrow_arc_arrows_per_level: 0.20
arrow_arc_arrows_max: 48
arrow_arc_rings: 3
arrow_arc_staggered: true
arrow_arc_no_gravity: true
arrow_arc_speed: 1.6
arrow_arc_lifetime_seconds: 6   # 0 leaves them until they land.
arrow_arc_damage_base: 3.0
arrow_arc_damage_per_level: 0.05
arrow_arc_damage_max: 8.0
# From this boss level, up to so many arrows per ring carry an effect from the list.
arrow_arc_random_effect_level_threshold: 1
arrow_arc_random_effects_max_per_ring: 16
arrow_arc_effect_duration_seconds: 6
arrow_arc_effect_amplifier_min: 0
arrow_arc_effect_amplifier_max: 1
arrow_arc_negative_effects: [ SLOWNESS, POISON, WEAKNESS, MINING_FATIGUE, BLINDNESS, HUNGER, WITHER, LEVITATION, NAUSEA, DARKNESS, UNLUCK, BAD_OMEN ]

# ---------------------------------------------------------------------------
#  Arrow rain: waves of arrows falling on a square around the player the
#  boss fights.
# ---------------------------------------------------------------------------
arrow_rain_cooldown: 8000
arrow_rain_cooldown_bias: 1.1
arrow_rain_arrows_base: 30
arrow_rain_arrows_per_level: 0.30
arrow_rain_arrows_max: 90
arrow_rain_waves: 2
arrow_rain_wave_interval_ticks: 20
arrow_rain_half_size: 8.0              # Half the square's side: 8.0 is 16×16.
arrow_rain_height: 12.0
arrow_rain_fall_speed: 0.9
arrow_rain_lifetime_seconds: 6
arrow_rain_damage_base: 2.6
arrow_rain_damage_per_level: 0.06
arrow_rain_damage_max: 7.0
arrow_rain_random_effect_level_threshold: 35
arrow_rain_random_effects_max_per_wave: 24
arrow_rain_effect_duration_seconds: 6
arrow_rain_effect_amplifier_min: 0
arrow_rain_effect_amplifier_max: 1
arrow_rain_negative_effects: [ SLOWNESS, POISON, WEAKNESS, MINING_FATIGUE, BLINDNESS, HUNGER, WITHER, LEVITATION, NAUSEA, DARKNESS, UNLUCK, BAD_OMEN ]

# ---------------------------------------------------------------------------
#  Summoning limits: a boss keeps no more minions alive than this, and a
#  summon only tops them up. Minions that rolled into bosses don't summon
#  their own unless summoning_by_mini_bosses is on.
# ---------------------------------------------------------------------------
summoning_max_alive: 12
summoning_by_mini_bosses: false

# ---------------------------------------------------------------------------
#  Shockwave: the boss slams the ground; players around it take damage and
#  fly back, the closer the harder.
# ---------------------------------------------------------------------------
is_shockwave_enabled: true
shockwave_cooldown: 9000
shockwave_cooldown_bias: 1.3
shockwave_radius: 5.0
shockwave_damage_base: 3.0
shockwave_damage_per_level: 0.08
shockwave_damage_max: 14.0
shockwave_knockback: 1.2
shockwave_lift: 0.5

# ---------------------------------------------------------------------------
#  Frost nova: players around the boss freeze as in powder snow and slow down.
#  Leather armor keeps the freezing off, as in the game.
# ---------------------------------------------------------------------------
is_frost_nova_enabled: true
frost_nova_cooldown: 14000
frost_nova_cooldown_bias: 1.2
frost_nova_radius: 6.0
frost_nova_seconds_base: 3.0
frost_nova_seconds_per_level: 0.05
frost_nova_seconds_max: 8.0
frost_nova_slowness_amplifier: 1

# ---------------------------------------------------------------------------
#  Grapple: the boss yanks the farthest player it can see toward itself, an
#  answer to shooting it from a pillar or across a ravine.
# ---------------------------------------------------------------------------
is_grapple_enabled: true
grapple_cooldown: 12000
grapple_cooldown_bias: 1.3
grapple_range: 24.0
grapple_min_distance: 6.0
grapple_strength: 1.2

# ---------------------------------------------------------------------------
#  Enrage: once, when its health drops below the share, the boss gets
#  strength and speed until it dies. No cooldown: it happens once per boss.
# ---------------------------------------------------------------------------
is_enrage_enabled: true
enrage_health_share: 0.3
enrage_strength_amplifier_base: 0
enrage_strength_amplifier_per_level: 0.02
enrage_strength_amplifier_max: 2
enrage_speed_amplifier: 0

# ---------------------------------------------------------------------------
#  Obelisk: the boss raises an end crystal a few blocks away that heals it
#  through a beam while it stays within range, a share of its max health
#  each second, until it falls or seconds pass. Players break it with a
#  few hits, more at higher levels; nothing else can. At level 100: 1.2% a
#  second, up to 18% over the whole time.
# ---------------------------------------------------------------------------
obelisk:
  enabled: true
  cooldown: 40000
  cooldown_bias: 1.2
  seconds: 15
  heal_share_base: 0.004
  heal_share_per_level: 0.00008
  heal_share_max: 0.012
  hits_base: 2
  hits_per_level: 0.04
  hits_max: 6
  range: 16.0

# ---------------------------------------------------------------------------
#  Chain: the boss chains the farthest player in sight, one who keeps at
#  least min_distance away, like an archer, and hauls them in like a rope:
#  past its length, which shortens as it goes, it pulls them back in heaves
#  and hurts once a second. break_hits blows to the boss in melee break it.
# ---------------------------------------------------------------------------
chain:
  enabled: true
  cooldown: 18000
  cooldown_bias: 1.3
  range: 24.0
  min_distance: 8.0
  length: 8.0            # How far the player may stray at first.
  reel_per_second: 0.6   # The boss hauls it in, down to min_length.
  min_length: 3.0
  # How fast it pulls past its length, in blocks a tick, by level: 0.2 about
  # holds a sprinting player in place. It heaves by surge up and down every
  # surge_seconds, so a sprint between heaves gains ground.
  pull_base: 0.2
  pull_per_level: 0.002
  pull_max: 0.32
  surge: 0.5
  surge_seconds: 1.6
  slack: 8.0             # This far past it, as after an ender pearl, it yanks them back at once.
  seconds_base: 5.0
  seconds_per_level: 0.05
  seconds_max: 10.0
  damage_base: 2.0
  damage_per_level: 0.05
  damage_max: 8.0
  break_hits: 3

# ---------------------------------------------------------------------------
#  Doubles: the boss vanishes in smoke and comes back among copies that look
#  just like it, up to count_max. A copy falls to one hit and drops only
#  what its mob would, and 1 experience; the rest vanish after seconds.
# ---------------------------------------------------------------------------
doubles:
  enabled: true
  cooldown: 35000
  cooldown_bias: 1.2
  count_base: 2
  count_per_level: 0.04
  count_max: 6
  seconds: 20
  radius: 5.0

# ---------------------------------------------------------------------------
#  Second phase: a boss of min_level or higher, once below health_share of
#  its health, can't be hurt for a few seconds,
#  throws everyone back, casts an ability at once, and from then on casts
#  faster: its cooldowns times cooldown_factor. Not tied to classes.
# ---------------------------------------------------------------------------
phase_two:
  enabled: true
  min_level: 40
  health_share: 0.5
  invulnerable_seconds: 3
  cooldown_factor: 0.65

# ---------------------------------------------------------------------------
#  Signature abilities: each boss type's own, on top of the shared ones. A
#  class gets them from its signature level in classes.yml. strength scales
#  their damage and durations; types lists the boss types that have one.
# ---------------------------------------------------------------------------
signature:
  potion_volley: { enabled: true, cooldown: 9000, cooldown_bias: 1.3, strength: 1.0, types: [ WITCH ] }   # splash potions at the players it fights near it
  fireball_barrage: { enabled: true, cooldown: 8000, cooldown_bias: 1.3, strength: 1.0, types: [ BLAZE ] }   # small fireballs that burn players, not blocks
  aimed_volley: { enabled: true, cooldown: 7000, cooldown_bias: 1.3, strength: 1.0, types: [ SKELETON, STRAY, BOGGED, PILLAGER ] }   # a fan of arrows at the player it fights
  pounce: { enabled: true, cooldown: 6000, cooldown_bias: 1.3, strength: 1.0, types: [ SPIDER, CAVE_SPIDER ] }   # a leap and a bite: slowness, or poison from a cave spider
  swap: { enabled: true, cooldown: 14000, cooldown_bias: 1.3, strength: 1.0, types: [ ENDERMAN ] }   # trades places with the player it fights, blinding them
  trident_storm: { enabled: true, cooldown: 9000, cooldown_bias: 1.3, strength: 1.0, types: [ DROWNED ] }   # tridents nobody can pick up
  fang_line: { enabled: true, cooldown: 8000, cooldown_bias: 1.3, strength: 1.0, types: [ EVOKER ] }   # a line of fangs along the ground
  whirlwind: { enabled: true, cooldown: 8000, cooldown_bias: 1.3, strength: 1.0, types: [ VINDICATOR, PIGLIN_BRUTE ] }   # a spin that hits and throws back players close by
  wither_aura: { enabled: true, cooldown: 12000, cooldown_bias: 1.3, strength: 1.0, types: [ WITHER_SKELETON ] }   # a withering cloud
  sandstorm: { enabled: true, cooldown: 14000, cooldown_bias: 1.3, strength: 1.0, types: [ HUSK ] }   # blindness and hunger
  infection: { enabled: true, cooldown: 12000, cooldown_bias: 1.3, strength: 1.0, types: [ ZOMBIE, ZOMBIE_VILLAGER ] }   # hunger, weakness, and nausea
  wind_burst: { enabled: true, cooldown: 8000, cooldown_bias: 1.3, strength: 1.0, types: [ BREEZE ] }   # wind charges: knockback, no broken blocks
  war_cry: { enabled: true, cooldown: 18000, cooldown_bias: 1.3, strength: 1.0, types: [ PIGLIN ] }   # strength and speed for it and the piglins around
  terror: { enabled: true, cooldown: 16000, cooldown_bias: 1.3, strength: 1.0, types: [ PHANTOM ] }   # darkness and a moment of blindness
  phase: { enabled: true, cooldown: 15000, cooldown_bias: 1.3, strength: 1.0, types: [ VEX ] }   # invisibility and speed for a few seconds
  stampede: { enabled: true, cooldown: 9000, cooldown_bias: 1.3, strength: 1.0, types: [ RAVAGER, HOGLIN ] }   # a charge that tramples whoever stands at its end
  curse: { enabled: true, cooldown: 30000, cooldown_bias: 1.3, strength: 1.0, types: [ GUARDIAN ] }   # the elder guardian's mining fatigue for players in sight
  fuse: { enabled: true, cooldown: 12000, cooldown_bias: 1.3, strength: 1.0, types: [ CREEPER ] }   # speed and resistance for a few seconds
