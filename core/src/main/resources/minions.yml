###############################################################################
#                          Mo’Bosses minions                                  #
###############################################################################
# What each boss type summons with its summoning ability: summoner is the boss's
# entity type, entity the minion's. Zombies, husks, drowned, piglins, zombie
# villagers, and hoglins come as babies. A boss keeps no more minions alive than
# summoning_max_alive in abilities.yml, and minions despawn as vanilla mobs do.
# A minion may roll into a weaker boss, as a natural spawn does
# (mini_bosses_level_curve in config.yml).
#
# Minion names live in lang/ under minions.<summoner>, and each player reads
# them in their own language. A name: key here shows that name to everyone
# instead, as 1.x did.

minions:
  - { summoner: ZOMBIE, entity: ZOMBIE }
  - { summoner: SPIDER, entity: CAVE_SPIDER }
  - { summoner: SKELETON, entity: SKELETON }
  - { summoner: ENDERMAN, entity: ENDERMITE }
  - { summoner: WITHER_SKELETON, entity: WITHER_SKELETON }
  - { summoner: PILLAGER, entity: PILLAGER }
  - { summoner: EVOKER, entity: VINDICATOR }
  - { summoner: WITCH, entity: ZOMBIE }
  - { summoner: VINDICATOR, entity: VEX }
  - { summoner: STRAY, entity: STRAY }
  - { summoner: HUSK, entity: HUSK }
  - { summoner: DROWNED, entity: DROWNED }
  - { summoner: PHANTOM, entity: PHANTOM }
  - { summoner: VEX, entity: VEX }
  - { summoner: ZOMBIE_VILLAGER, entity: ZOMBIE_VILLAGER }
  - { summoner: BOGGED, entity: BOGGED }
  - { summoner: BLAZE, entity: BLAZE }
  - { summoner: BREEZE, entity: BREEZE }
  - { summoner: CAVE_SPIDER, entity: CAVE_SPIDER }
  - { summoner: PIGLIN_BRUTE, entity: PIGLIN }
  - { summoner: HOGLIN, entity: HOGLIN }
  - { summoner: RAVAGER, entity: PILLAGER }
  - { summoner: GUARDIAN, entity: GUARDIAN }
  - { summoner: ENDER_DRAGON, entity: PHANTOM }
  - { summoner: WITHER, entity: WITHER_SKELETON }
  - { summoner: ZOMBIFIED_PIGLIN, entity: ZOMBIFIED_PIGLIN }
