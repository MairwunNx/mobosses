###############################################################################
#                          Mo’Bosses configuration                            #
###############################################################################
# Every key here has a default, so you can delete the ones you don't change.
# A value that doesn't fit (a word where a number goes) costs only itself: the
# log says which one, and it takes its default. /mobosses reload applies changes
# without a restart. Messages live in lang/<language>.yml.

enabled: true   # false stops new bosses and abilities; bosses already around stay.
debug: false    # true logs spawns, levels, abilities, and loot.

locales:
  # Players nothing else matches and the console get this language, and so do
  # death messages, which the game shows to everyone the same.
  default: en
  # Where a player's language comes from, tried in order:
  #   ip     — the country of their IP address, through the lists below;
  #   client — the language set in their game, when a lang/ file matches it.
  sources: [ ip, client ]
  # Language → the ISO 3166 country codes that get it. Add a lang/it.yml and an
  # “it: [ IT, SM, VA ]” line to add Italian.
  countries:
    ru: [ RU, BY, KZ, KG, TJ, UZ, AM, AZ, MD, GE, TM ]
    es: [ ES, MX, AR, CO, CL, PE, VE, EC, GT, CU, BO, DO, HN, PY, SV, NI, CR, PA, UY, PR, GQ ]
    pt: [ BR, PT, AO, MZ, CV, GW, ST, TL ]
    de: [ DE, AT, CH, LI, LU ]

geoip:
  # The country database: DB-IP's free “IP to Country Lite”, CC BY 4.0, about 4 MB.
  # The plugin downloads it into geoip/ and refreshes it once it's older than
  # refresh_days. Lookups happen on your server; no address leaves it.
  enabled: true
  url: "https://download.db-ip.com/free/dbip-country-lite-{year}-{month}.mmdb.gz"
  refresh_days: 30

# ---------------------------------------------------------------------------
#  Spawning
# ---------------------------------------------------------------------------
# A mob of a type in bosses.yml becomes a boss with that type's spawn_chance,
# times the multipliers below, once in its life. The players within group_radius
# set the boss's level together, by their average, so one veteran doesn't drag
# newcomers into level 90 fights.
spawn:
  enabled: true
  max_bosses_per_world: 10000000   # Loaded bosses per world.
  # Most mobs spawn in caves no player walks into. With on_sight, a mob waits to
  # roll until a player within radius could see it, with a puff of smoke if it
  # comes out a boss; walking off and coming back never rolls it again. Mobs with
  # a name, an owner, or a leash by then never roll. Off, a mob rolls as it
  # spawns, with a player within spawn_radius. Minions always roll at once.
  on_sight:
    enabled: true
    radius: 32
    line_of_sight: true   # false: within radius is enough, through walls too.
  spawn_radius: 100
  world_multipliers:               # By world name; worlds not listed use 1.0.
    world: 1.25
    world_nether: 1.4
    world_the_end: 1.6
  time_multipliers:
    day: 0.7
    night: 1.0
  weather_multipliers:
    clear: 1.0
    rain: 1.1
    thunder: 1.3
  # Experimental: no boss when the mob and the player are in different zones,
  # one on the surface and the other in a cave, by this many blocks below the top.
  check_vertical_zone: false
  vertical_zone_threshold: 14
  # Spawn reasons that can make a boss. CUSTOM covers minions bosses summon.
  # https://jd.papermc.io/paper/org/bukkit/event/entity/CreatureSpawnEvent.SpawnReason.html
  allowed_spawn_reasons: [ NATURAL, JOCKEY, SPAWNER, TRIAL_SPAWNER, EGG, SPAWNER_EGG, VILLAGE_INVASION, NETHER_PORTAL, DROWNED, RAID, PATROL, COMMAND, CUSTOM ]
  group_radius: 24
  # Against piles of bosses, from mob farms and spawners too: after a boss spawns
  # for a group, its players wait player_cooldown_seconds (stretched at random by
  # up to the bias) for the next one, across relogs and restarts; and no boss
  # spawns while max_nearby are already within nearby_radius.
  player_cooldown_seconds: 60
  player_cooldown_bias: 1.3
  max_nearby: 3
  nearby_radius: 48

# As in Sacred: each minute a player plays without dying raises the chance of
# bosses near them, by half of max_bonus after half_at_minutes, nearing all of
# it later: +25% after an hour, +50% after three, +75% after nine. Death takes it
# all. A minute idle for idle_minutes or more doesn't count, so AFK earns nothing.
survival_bonus:
  enabled: true
  max_bonus: 1.0
  half_at_minutes: 180
  idle_minutes: 3

# Advancements in a tab of their own (press L): the hunt's path by level and
# kills, the ladder of classes, the bestiary, and feats from the fights. The game
# shows every player the same text, so it comes in one language: empty takes
# locales.default. A change of language applies after a restart.
achievements:
  enabled: true
  language: ""

# Nights of the hunt: on a full-moon night in a world with a sky, the spawn
# chance grows by chance, and the rarest class's weight by rarer_classes, the
# ones between by their share, Common's not at all. Other phases change nothing.
full_moon:
  enabled: true
  chance: 1.5
  rarer_classes: 2.0
  announce: true   # “full_moon” to the players in the world as it rises.

# A boss grows as more players truly fight it: a player counts once they've
# dealt fighter_share of its health, and each one past the first adds per_player
# of it, up to max_players. Someone who only stood by changes nothing; the boss's
# health grows in step, so one at half stays at half, and never shrinks back.
group_health:
  enabled: true
  per_player: 0.35
  max_players: 6
  fighter_share: 0.05

# Bosses from spawners give less to a player who keeps killing them in one spot:
# each such kill within radius counts, fading by half every half_life_minutes;
# past free of them, each one more takes step off the experience and the loot
# chance, down to floor. Natural bosses are never affected.
spawner_fatigue:
  enabled: true
  radius: 32
  half_life_minutes: 20
  free: 3.0
  step: 0.25
  floor: 0.2

# A boss with no player within radius for after_minutes leaves, without loot,
# as vanilla mobs do, so bosses don't pile up in caves for good. One found again
# long after its chunk unloaded leaves as the chunk loads.
despawn:
  enabled: true
  after_minutes: 10
  radius: 64
  keep_spawned_by_command: true   # Bosses from /mobosses spawn stay.

# Tricks that beat bosses without a fight.
anti_cheese:
  vehicles: true   # Bosses never get into boats or minecarts.
  portals: true    # Bosses never go through portals.
  # A boss a player keeps hitting from beyond reach, which can't get to them for
  # unreachable_seconds or hasn't moved a block for stuck_seconds, steps out next
  # to them: off a pillar, out of a hole, from under a trapdoor. When nothing next
  # to them fits, as on top of a pillar, it pulls them off instead. Once in
  # cooldown_seconds at most. An archer that can see its target never counts.
  step_out:
    enabled: true
    unreachable_seconds: 8
    stuck_seconds: 6
    cooldown_seconds: 20
    reach: 3.0

# ---------------------------------------------------------------------------
#  Player levels
# ---------------------------------------------------------------------------
progression:
  # A player's level, from the Mo’Bosses experience and kills they've gathered.
  level_curve:
    max_level: 100
    exp_scale: 30.0    # Higher: experience counts for less.
    kill_scale: 20.0   # Lower: kills count for more.
    power: 1.6         # Higher: a steeper climb in the second half.
    offset: 60.0       # Higher: longer at low levels.

  # A minion that rolls into a boss is this many levels below its summoner.
  mini_bosses_level_curve:
    min_delta: 1
    max_delta: 18
    power: 1.15
    offset: 90
    percent_cap: 0.28  # Never more than 28% of the summoner's level.
    jitter: 1          # A random ±1; 0 turns it off.

  # Mo’Bosses experience for a kill, split by each player's share of the damage
  # and weighed by relevance below.
  exp_gain:
    health_factor: 0.01   # Per point of the boss's max health.
    level_factor: 0.005   # Times the level to the power below.
    level_power: 2.0
    rarity_mul: true      # Times the class's experience multiplier.

  # Now and then a boss comes weaker, by a share of its level: more often and by
  # more at high levels, but never from level 80 down to 20.
  variance:
    base_chance: 0.15
    extra_chance: 0.35    # Added at max_level.
    min_cut: 0.05         # 5% of the level,
    max_cut: 0.30         # up to 30% at max_level.
    power: 1.2

  # Bosses below a player's level give them less, so farming weak ones levels
  # nobody up; stronger ones give a little more. Levels compare by ratio,
  # (boss + offset) / (player + offset), so a few levels apart mean little to
  # newcomers. Below 1, the ratio to the power is the share of experience, never
  # under floor; above 1, the ratio itself, up to bonus. Under kill_ratio the kill
  # doesn't count: level 80 against a level 60 boss still counts, against 40 not.
  relevance:
    offset: 15.0
    power: 1.5
    floor: 0.1
    bonus: 1.5
    kill_ratio: 0.65
  min_share: 0.15   # The share of a boss's health a player must deal for the kill to count.
  # In a group of N players, no share threshold (this one, loot's, and rewards')
  # asks for more than group_share / N: four friends who split a boss evenly all
  # get loot.
  group_share: 0.6
  # A player's pets add to their share, and so to kills and loot, in full. In
  # experience their damage is worth a bit less as bosses grow: almost all of it
  # at low levels, min_weight of it at the top.
  pet_damage:
    min_weight: 0.5
    power: 1.5
    offset: 300.0
  # Dying to a boss, by its blow, its shot, or its ability, burns the progress
  # toward the next level: experience drops to the least that keeps the level.
  death_penalty: true

# ---------------------------------------------------------------------------
#  Boss stats
# ---------------------------------------------------------------------------
# Each stat is the mob's vanilla value × the class multiplier × a curve by level
# that starts at 1 and approaches max_scale. offset delays the climb, power makes
# it steeper, and flatten (0 to 1) shrinks the class difference at high levels.
# With these, a zombie boss outlasts the Ender Dragon (200) from level 30 as a
# Common and from 20 as a Rare, and the Warden (500) from 40 as an Epic, 20 as a
# Mythic, and 100 as a Common.
formula:
  health:
    max_scale: 32.0
    power: 1.8
    offset: 1000.0
    flatten: 0.35
    base_points: 20.0   # Smaller mobs, like spiders and vexes, start from a zombie's 20.
  damage:
    max_scale: 6.0
    power: 1.3
    offset: 180.0
    flatten: 0.40
  # The share of the damage growth that a boss's own arrows, fireballs, and
  # tridents get; abilities have their own damage.
  ranged_damage: 0.6
  # A creeper boss's blast radius: the game's (3, or 6 when charged) plus up to
  # max_extra blocks by level: 3 to 8, or 6 to 11 when charged, at level 100.
  # A creeper that blows itself up gives nobody anything: nobody killed it.
  explosion:
    max_extra: 6.0
    power: 1.2
    offset: 60.0
  # The vanilla experience a boss drops: its mob's own (at least base_points) ×
  # the class's experience × this curve. A level 1 Common zombie gives 8, a bit
  # more than the zombie's 5; from level 30 a Common gives more than the Ender
  # Dragon's 500, as it outlasts the dragon; a level 100 Mythic gives 20,000, more
  # than the dragon's first kill, about level 86 from nothing. It splits by share.
  experience:
    max_scale: 600.0
    power: 3.0
    offset: 200000.0
    base_points: 5.0
  # Armor and toughness apply to bosses without an armor set from bosses.yml.
  # base_points stands in for mobs with less of their own: most have no
  # toughness and skeletons no armor, and nothing times a multiplier is nothing.
  armor:
    max_scale: 2.0
    power: 1.2
    offset: 180.0
    flatten: 0.35
    cap_points: 28
    base_points: 2.0
  toughness:
    max_scale: 2.2
    power: 1.1
    offset: 200.0
    flatten: 0.30
    cap_points: 12
    base_points: 2.0
  # How many minions a summon brings.
  minions:
    base_count: 2
    max_count: 12
    power: 1.2
    offset: 80.0
    variance: 0.15   # ±15%.

# The game's difficulty grades new bosses; bosses already around keep theirs.
# Peaceful makes none. Each difficulty has a modifier, and each part of a boss
# takes its weight of it: 1 + (modifier − 1) × weight, so a weight of 0 leaves
# that part as on hard, and cooldowns divide by their part. A boss is never
# weaker than its vanilla mob. The balance was built for hard, which is 1.0.
# enabled: false plays every difficulty but peaceful as hard.
difficulty:
  enabled: true
  modifiers:
    easy: 0.7333333337
    normal: 0.8777777773
    hard: 1.0
    hardcore: 1.2333333339
  weights:
    health: 1.0
    damage: 1.0         # Melee, and ranged through formula.ranged_damage.
    armor: 0.5          # Armor and toughness.
    cooldowns: 0.5      # Abilities' cooldowns divide by their part.
    minions: 0.5        # How many a summon brings.
    spawn_chance: 0.5
    experience: 1.0     # The vanilla experience a boss drops.

# ---------------------------------------------------------------------------
#  Looks
# ---------------------------------------------------------------------------
effects:
  particles:
    enabled: true
    update_interval: 20   # Ticks between puffs of the boss's particles.
  glow:
    enabled: true
    classes: [ uncommon, rare, epic, legendary, mythic ]   # An empty list means all.
  visibility_radius: 32   # Glow and particles show only with a player this close.

# Names over bosses and minions. per_player shows each player the names in their
# own language, through invisible text displays only they see; off shows the
# game's name tag in the default language to everyone, as 1.x did.
name_tags:
  per_player: true
  radius: 32

boss_bar:
  enabled: true
  # PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, or NOTCHED_20.
  style: NOTCHED_20
  hide_distance: 64   # A player farther than this stops seeing the bar.

# ---------------------------------------------------------------------------
#  Loot and messages
# ---------------------------------------------------------------------------
loot:
  # Tools and armor from loottable.yml with random_durability come partly worn.
  random_durability:
    enabled: true
    min_durability: 0.1   # At least 10% of their durability left,
    max_durability: 0.9   # at most 90%; better classes lean toward the top.
  min_damage_share: 0.27777777   # The share of the boss's health a player must deal for loot.
  # A player whose drops from bosses that can give rare loot brought nothing rare
  # or better gets a rare item at least, after a count rolled anew each time
  # between min_drops and max_drops, so it shows no pattern. Never above the
  # boss's class: Common and Uncommon bosses don't count toward it.
  pity:
    enabled: true
    min_drops: 8
    max_drops: 12
  # The survival bonus tips loot toward rare and better items: their weights
  # grow by bonus × survival_luck × 1 for rare, 1.5 epic, 2 legendary, 2.5 mythic.
  survival_luck: 1.0

broadcast:
  kills: true       # “kill” to everyone when players kill a boss.
  rare_loot: true   # “loot.*” to everyone for rare, epic, legendary, and mythic loot.
  abilities: true   # “abilities.*” to everyone fighting the boss.
  abilities_in: action_bar   # action_bar, over the hotbar, or chat.
  spawns_from: epic          # “boss_nearby” to players near a new boss this rare or rarer; none turns it off.
  spawns_radius: 64
  # “kill_notes.*” to each player after a kill, in the chat: why they got less
  # experience, no loot, no rewards, or no kill, and when a boss above their
  # level gave more.
  kill_notes: true

kill_sound:
  enabled: true
  key: "minecraft:ui.toast.challenge_complete"

# ---------------------------------------------------------------------------
#  Database
# ---------------------------------------------------------------------------
# Where players' levels live: sqlite (a file here), mysql (MySQL or MariaDB),
# or postgres. A change applies on /mobosses reload.
database:
  type: sqlite
  sqlite:
    file: bosses.db
  mysql:
    host: localhost
    port: 3306
    database: mobosses
    username: root
    password: password
    ssl: false
  postgres:
    host: localhost
    port: 5432
    database: mobosses
    username: mobosses
    password: secret
    ssl: false

# ---------------------------------------------------------------------------
#  Protected areas
# ---------------------------------------------------------------------------
# Each part works only when its plugin runs on the server.
protection:
  griefprevention:
    enabled: true
    no_bosses_in_claims: true            # No boss spawns naturally in a claim.
    no_block_abilities_in_claims: true   # No ability breaks, places, or ignites blocks in a claim.
  worldguard:
    enabled: true
    spawn_flags: true     # Natural spawns follow mobosses-spawn and mob-spawning.
    # No boss spawns in a region with owners or members, a player's plot, unless
    # mobosses-spawn allows it there. Regions without owners, like spawn, keep bosses.
    no_bosses_in_owned_regions: true
    ability_flags: true   # Block-changing abilities follow mobosses-abilities and build.
    damage_flags: true    # Ability damage to players follows mob-damage.
  admin_spawn_bypass: true   # /mobosses spawn works anywhere; false makes it ask too.

# Block changes by bosses, their abilities, and their minions go to CoreProtect
# under this user, so /co rollback u:#mobosses t:1h r:50 undoes them.
coreprotect:
  enabled: true
  user: "#mobosses"
